<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Meeting Outcome Assistant · Interactive wireframe</title>
<style>
:root{
  --bg:#f5f5f5;--surface:#fff;--surface2:#faf9f8;--line:#e1dfdd;--line2:#bebbb8;
  --text:#242424;--muted:#5f5e5c;
  --blue:#0f6cbd;--blue-d:#0c5a9e;--blue-bg:#ebf3fc;--blue-line:#b4d6fa;
  --green:#0b6a0b;--green-bg:#dff6dd;
  --amber:#6e4b00;--amber-bg:#fff4ce;
  --red:#a4262c;--red-bg:#fdf3f4;
  --purple:#5c2e91;--purple-bg:#f2ecfa;
  --teal:#005a5a;--teal-bg:#e0f4f4;
  --slate:#3b3a39;--slate-bg:#e1dfdd;
  --demo-h:0px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg);display:flex;flex-direction:column;height:100vh;overflow:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.25}
h1{font-size:22px}h2{font-size:17px}h3{font-size:15px}h4{font-size:14px}
p{margin:0 0 8px}
ul,ol{margin:0;padding-left:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;padding:0;margin:-1px}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:12px}
.skip{position:absolute;left:8px;top:-60px;background:#fff;border:2px solid var(--blue);padding:6px 10px;z-index:200;border-radius:6px}
.skip:focus{top:8px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;vertical-align:-3px}
svg.i.fill{fill:currentColor;stroke:none}

/* ===== demo bar ===== */
.demobar{flex:none;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;padding:6px 16px;background:#f3f2f1;border-bottom:1px solid var(--line2)}
.banner{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--slate);font-weight:600}
.banner svg{color:var(--blue)}
.democtl{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1px dashed var(--line2);border-radius:8px;padding:3px 8px;background:#fff}
.democtl .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.democtl select{border:1px solid var(--line2);border-radius:6px;padding:3px 6px;min-height:28px;background:#fff;max-width:240px}

/* ===== shell ===== */
.shell{flex:1;min-height:0;display:grid;position:relative;
  grid-template-columns:216px minmax(0,1fr) var(--panelw,0px);
  grid-template-rows:48px minmax(0,1fr);
  grid-template-areas:"top top top" "nav main panel"}
.shell.has-panel{--panelw:clamp(380px,34vw,460px)}
.shell.has-panel.panel-wide{--panelw:clamp(520px,calc(100vw - 656px),780px)}
.topbar{grid-area:top;display:flex;align-items:center;gap:12px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line)}
.topbar .app{font-weight:700;font-size:15px}
.topbar .sp{flex:1}
.waffle{width:20px;height:20px;color:var(--blue)}
.seller{display:flex;align-items:center;gap:8px;font-size:13px}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.nav{grid-area:nav;background:#fff;border-right:1px solid var(--line);padding:12px 8px;overflow:auto}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px;margin-bottom:2px;font-size:14px}
.nav button:hover{background:#f3f2f1}
.nav button[aria-current=page]{background:var(--blue-bg);color:#0a4d8c;font-weight:600;box-shadow:inset 3px 0 0 var(--blue)}
.nav .navhint{margin:14px 10px 0;font-size:12px;color:var(--muted)}
main{grid-area:main;overflow:auto;min-width:0;background:var(--bg)}
main.fixed{overflow:hidden;display:flex;flex-direction:column}
.page{padding:20px 24px 36px;max-width:1120px;margin:0 auto}
.pagehead{margin-bottom:14px}
.pagehead .lead{color:var(--muted);margin:6px 0 0;max-width:760px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

/* ===== panel ===== */
aside.panel{grid-area:panel;display:none;flex-direction:column;background:#fff;border-left:1px solid var(--line);min-height:0;min-width:0}
.shell.has-panel aside.panel{display:flex}
.panel-head{padding:10px 14px 0;border-bottom:1px solid var(--line)}
.panel-title{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:6px}
.panel-title .btns{display:flex;gap:6px}
.evswitch{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pill{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:2px 10px;font-size:13px}
.pill[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.pill.disc{text-decoration:line-through}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs [role=tab]{border:0;background:none;padding:8px 10px;border-bottom:3px solid transparent;font-size:13px;white-space:nowrap;color:var(--muted);font-weight:600}
.tabs [role=tab]:hover{color:var(--text)}
.tabs [role=tab][aria-selected=true]{color:#0a4d8c;border-bottom-color:var(--blue)}
.panel-body{flex:1;overflow:auto;padding:14px}
.only-narrow{display:none}
.pagetabs{display:flex;gap:2px;border-bottom:1px solid var(--line2);margin:14px 0;overflow-x:auto}
.pagetabs [role=tab]{border:0;background:none;padding:8px 12px;border-bottom:3px solid transparent;font-weight:600;color:var(--muted);white-space:nowrap}
.pagetabs [role=tab][aria-selected=true]{color:#0a4d8c;border-bottom-color:var(--blue)}

/* ===== cards / buttons / badges ===== */
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.card.soft{background:var(--surface2)}
.card+.card{margin-top:12px}
.card h3,.card h2{margin-bottom:6px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid2>.card,.grid3>.card{margin-top:0}
.stack>*+*{margin-top:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line2);background:#fff;border-radius:6px;padding:6px 12px;min-height:32px;display:inline-flex;align-items:center;gap:6px;font-weight:600}
.btn:hover{background:#f3f2f1}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-d)}
.btn.sm{padding:2px 9px;min-height:26px;font-size:13px}
.btn.link{border-color:transparent;background:none;color:var(--blue);padding:2px 4px;min-height:24px;font-weight:600;font-size:13px}
.btn.link:hover{text-decoration:underline;background:none}
.btn[aria-disabled=true]{background:#f3f2f1;color:#4d4c4a;border-style:dashed;cursor:not-allowed}
.btn[aria-disabled=true]:hover{background:#f3f2f1}
.btn.danger{color:var(--red);border-color:#e3b0b3}
.badge{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;line-height:1.5;border:1px solid transparent}
.badge svg.i{width:13px;height:13px;vertical-align:-2px}
.b-green{background:var(--green-bg);color:var(--green);border-color:#a9d8a6}
.b-blue{background:var(--blue-bg);color:#0a4d8c;border-color:var(--blue-line)}
.b-amber{background:var(--amber-bg);color:var(--amber);border-color:#ebcf7a}
.b-slate{background:var(--slate-bg);color:var(--slate);border-color:#a19f9d}
.b-future{background:#fff;color:var(--slate);border:1px dashed #8a8886}
.bs-user{background:var(--blue-bg);color:#0a4d8c;border-color:var(--blue-line)}
.bs-derived{background:var(--teal-bg);color:var(--teal);border-color:#9bd3d3}
.bs-crm{background:var(--green-bg);color:var(--green);border-color:#a9d8a6}
.bs-ai{background:var(--purple-bg);color:var(--purple);border-color:#cdb6e8}
.bs-missing{background:#fff;color:var(--muted);border:1px dashed #8a8886}
.bs-conflict{background:var(--red-bg);color:var(--red);border-color:#e3b0b3}
.bs-ignored{background:#f3f2f1;color:var(--slate);border:1px dashed #605e5c}
.st{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:700;border:1px solid transparent}
.st svg.i{width:13px;height:13px}
.st-ready{background:var(--green-bg);color:var(--green);border-color:#a9d8a6}
.st-needs{background:var(--amber-bg);color:var(--amber);border-color:#ebcf7a}
.st-conflict{background:var(--red-bg);color:var(--red);border-color:#e3b0b3}
.st-reviewed{background:var(--blue-bg);color:#0a4d8c;border-color:var(--blue-line)}
.st-discarded{background:var(--slate-bg);color:var(--slate);border-color:#a19f9d}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:#fff}
.chip{display:inline-flex;align-items:center;border:1px solid var(--line2);background:#fff;border-radius:6px;padding:0 7px;min-height:22px;font-size:12px;font-weight:700;color:var(--slate)}
button.chip:hover{background:var(--blue-bg)}
button.chip[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.callout{border-left:4px solid var(--blue);background:var(--blue-bg);padding:10px 12px;border-radius:0 8px 8px 0;font-size:13px}
.callout.warn{border-color:#b88700;background:var(--amber-bg)}
.callout.bad{border-color:var(--red);background:var(--red-bg)}
.callout.ok{border-color:var(--green);background:var(--green-bg)}
.callout.gray{border-color:#605e5c;background:#f3f2f1}
.callout strong{display:inline}
.callout>strong:first-child{display:block;margin-bottom:2px}
.empty{border:1px dashed var(--line2);border-radius:10px;padding:22px;text-align:center;color:var(--muted);background:#fff}
.empty h3{color:var(--text);margin-bottom:6px}

/* ===== home ===== */
.hero{display:grid;grid-template-columns:1fr;gap:10px;border:1px solid var(--blue-line);background:linear-gradient(180deg,#f6faff,#fff)}
.hero .ico{width:40px;height:40px;border-radius:10px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center}
.hero .ico svg{width:22px;height:22px}
.prompts{display:flex;flex-wrap:wrap;gap:8px}
.prompt{border:1px solid var(--blue-line);background:#fff;color:#0a4d8c;border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}
.prompt:hover{background:var(--blue-bg)}
.readiness{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px}
.legend{display:grid;gap:8px}
.legend div{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.homegrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}

/* ===== forms ===== */
label.lbl{display:block;font-weight:600;margin-bottom:4px}
textarea,input[type=text]{width:100%;border:1px solid var(--line2);border-radius:6px;padding:8px 10px;background:#fff}
textarea{min-height:128px;resize:vertical;line-height:1.5}
select{border:1px solid var(--line2);border-radius:6px;padding:5px 8px;background:#fff;min-height:32px}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.steps{list-style:none;padding:0;margin:0}
.steps li{display:flex;align-items:center;gap:8px;padding:5px 0}
.steps .dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--line2);flex:none;display:inline-flex;align-items:center;justify-content:center}
.steps li.active .dot{border-color:var(--blue);border-top-color:transparent;animation:spin .8s linear infinite}
.steps li.done .dot{border-color:var(--green);background:var(--green);color:#fff;animation:none}
.steps li.done .dot svg{width:11px;height:11px;stroke:#fff;stroke-width:2.4}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.steps li.active .dot{animation:none;border-top-color:var(--blue)}*{scroll-behavior:auto!important;transition:none!important}}
mark.hl,button.sent.sel{background:#fff1a8}
.sentlist{display:flex;flex-direction:column;gap:6px}
button.sent{display:flex;gap:8px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px;align-items:flex-start;width:100%}
button.sent:hover{border-color:var(--blue)}
button.sent.sel{border-color:#b88700;box-shadow:0 0 0 2px #f6d96b}
button.sent .sid{font-weight:700;color:#0a4d8c;min-width:28px}
button.sent.ignored{border-style:dashed;background:#f8f8f8}
.supports{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}

/* ===== chat ===== */
.workhead{padding:12px 20px 8px;background:#fff;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.chat{flex:1;overflow:auto;padding:16px 20px}
.msg{display:flex;gap:10px;margin:0 0 14px;max-width:780px}
.msg.user{margin-left:auto;flex-direction:row-reverse}
.msg .avatar.ma{background:#fff;color:var(--blue);border:1px solid var(--blue-line)}
.msg .avatar.ma svg{width:16px;height:16px}
.bubble{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.msg.user .bubble{background:var(--blue-bg);border-color:var(--blue-line)}
.bubble>*+*{margin-top:8px}
.who{font-size:12px;color:var(--muted);font-weight:600;margin-bottom:2px}
.evcard{border:1px solid var(--blue-line);border-radius:8px;padding:10px 12px;background:#f6faff}
.evcard .ttl{font-weight:600}
.qbox{border:1px solid #ebcf7a;background:#fffbe9;border-radius:8px;padding:10px 12px}
.qbox.done{opacity:.7;border-color:var(--line);background:#f8f8f8}
.qopts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.qgroup{margin-top:8px}
.qgroup .gl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.composer{border-top:1px solid var(--line);background:#fff;padding:8px 16px 10px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.chips .prompt{white-space:nowrap;padding:3px 10px;font-size:12.5px}
.cform{display:flex;gap:8px}
.cform input{flex:1}
.hint.sim{margin:6px 0 0}

/* ===== field rows & tables ===== */
.frow{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .fl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;padding-top:2px}
.frow .fv{min-width:0}
.frow .val{font-weight:600;word-break:break-word}
.frow .val.nv{color:var(--muted);font-weight:500;font-style:italic}
.frow .meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin-top:4px}
.frow .fn{grid-column:2/4;font-size:12.5px;color:var(--muted);margin-top:2px}
.frow.hlrow{background:#fff9d6;margin:0 -8px;padding-left:8px;padding-right:8px;border-radius:6px}
.editform{display:flex;flex-direction:column;gap:6px}
.editform .chk{font-size:13px;display:flex;gap:6px;align-items:center}
.editform .err{color:var(--red);font-size:13px}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}
table.tbl td{vertical-align:top;padding:8px;border-bottom:1px solid var(--line)}
table.tbl tr.hlrow td{background:#fff9d6}
table.tbl .q{font-style:normal;border-left:3px solid var(--blue-line);padding-left:8px;display:block;margin-bottom:4px}
table.tbl .calc{font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,monospace;font-size:12.5px;background:var(--teal-bg);color:var(--teal);padding:1px 6px;border-radius:4px}
.ba{display:grid;grid-template-columns:minmax(0,1fr) 24px minmax(0,1fr);gap:6px;align-items:start}
.ba .b{background:#f8f8f8;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.ba .a{background:#f6faff;border:1px solid var(--blue-line);border-radius:6px;padding:6px 8px}
.ba .arr{text-align:center;padding-top:8px;color:var(--muted)}
.chg{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px}
.chg h4{margin-bottom:6px}

/* ===== capability ===== */
.capgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.capgrid .card{margin-top:0}
.capgrid ul{margin-top:6px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;opacity:.85}
.flow .fstep{border:1px dashed #8a8886;border-radius:8px;padding:6px 10px;background:#f8f8f8;font-weight:600;font-size:13px}
.flow .arr{color:var(--muted)}
.compare th,.compare td{width:33%}
.qlist{display:grid;gap:10px}
.qlist .card{margin-top:0}
.diagram{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:10px}

/* ===== drawers / overlays ===== */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:80;display:none}
.scrim.show{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,96vw);background:#fff;z-index:90;box-shadow:-8px 0 24px rgba(0,0,0,.2);display:none;flex-direction:column}
.drawer.show{display:flex}
.drawer header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.drawer .dbody{padding:14px 16px;overflow:auto;flex:1}
.drawer .rules{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.drawer .rules li{display:flex;gap:10px;align-items:flex-start}
.drawer .rules svg{color:var(--blue);margin-top:2px}
.overlay{position:fixed;inset:0;z-index:100;background:#f5f5f5;overflow:auto;display:none}
.overlay.show{display:block}
.start{max-width:980px;margin:0 auto;padding:36px 24px}
.start h1{font-size:28px}
.start .chapters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin:20px 0}
.start .chapter{display:flex;flex-direction:column;gap:8px;text-align:left;background:#fff;border:1px solid var(--line2);border-radius:12px;padding:16px;min-height:150px}
.start .chapter:hover{border-color:var(--blue);box-shadow:0 2px 8px rgba(0,0,0,.08)}
.start .chapter .num{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.start .chapter b{font-size:16px}
.rotate{display:none;background:var(--amber-bg);color:var(--amber);padding:8px 12px;font-size:13px;font-weight:600}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#323130;color:#fff;padding:10px 16px;border-radius:8px;z-index:150;max-width:min(560px,92vw);font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.toast[hidden]{display:none}

/* ===== presenter dock ===== */
#presenter{flex:none;background:#1f2937;color:#f3f4f6;border-top:3px solid var(--blue);padding:8px 16px 10px;max-height:44vh;overflow:auto}
#presenter[hidden]{display:none}
#presenter .btn{background:#374151;border-color:#6b7280;color:#fff}
#presenter .btn:hover{background:#4b5563}
#presenter .btn.primary{background:#2b88d8;border-color:#2b88d8;color:#06121f}
#presenter .btn[aria-pressed=true]{background:#fff;color:#111}
#presenter :focus-visible{outline-color:#7fc3ff}
.pd-top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between}
.pd-top .ttl{font-weight:700}
.pd-ctrl{display:flex;flex-wrap:wrap;gap:6px}
.pd-track{display:flex;flex-wrap:wrap;gap:4px;list-style:none;padding:0;margin:8px 0}
.pd-track button{min-width:30px;height:28px;border-radius:6px;border:1px solid #6b7280;background:#374151;color:#fff;font-weight:700;font-size:13px}
.pd-track button[aria-current=step]{background:#fff;color:#111;border-color:#fff}
.pd-track .sep{width:12px}
.pd-cap{font-size:15px;margin:4px 0}
.pd-hood{font-size:13px;color:#d1d5db;margin:2px 0 6px}

'use strict';
/* ==========================================================================

   Everything in this file is local sample data and local state.
   No network calls, no credentials, no CRM or calendar access.
   ========================================================================== */

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const uniq = (v, i, a) => a.indexOf(v) === i;
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, REDUCED ? Math.min(ms, 40) : ms));

/* ---------- icons ---------- */
const ICON = {
  check: '<circle cx="8" cy="8" r="6.5"/><path d="M5 8.2l2 2 4-4.4"/>',
  tick: '<path d="M3.5 8.4l3 3 6-6.6"/>',
  clock: '<circle cx="8" cy="8" r="6.5"/><path d="M8 4.5V8l2.5 1.5"/>',
  key: '<circle cx="5" cy="8" r="2.6"/><path d="M7.6 8H14M12 8v2.3M10 8v1.7"/>',

  flag: '<path d="M4 14V2.5M4 3h8l-1.8 2.6L12 8.2H4"/>',
  user: '<circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.5c.5-3 2.5-4.3 5-4.3s4.5 1.3 5 4.3"/>',
  sigma: '<path d="M12.5 3h-9l5 5-5 5h9"/>',
  shield: '<path d="M8 2l5 2v4c0 3-2.2 5-5 6-2.8-1-5-3-5-6V4z"/><path d="M5.8 8l1.7 1.7 2.8-3"/>',
  sparkle: '<path d="M8 2l1.3 3.7L13 7l-3.7 1.3L8 12 6.7 8.3 3 7l3.7-1.3z"/>',

  chat: '<path d="M2.5 3.5h11v7H8l-3 2.5v-2.5H2.5z"/>',
  edit: '<path d="M3 13l.6-2.6 7-7 2 2-7 7zM9.6 4.4l2 2"/>',
  expand: '<path d="M9.5 2.5h4v4M6.5 13.5h-4v-4M13.5 2.5L9 7M2.5 13.5L7 9"/>',
  close: '<path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/>',

const ic = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 16 16" aria-hidden="true" focusable="false">${ICON[n] || ''}</svg>`;

/* ---------- readiness + basis vocabularies (from the brief) ---------- */
const READY = {
  validated: { cls: 'b-green', icon: 'check', text: 'Validated in private agent' },
  salesPending: { cls: 'b-blue', icon: 'clock', text: 'Configured · Sales validation pending' },

/* ---------- sample notes ---------- */
const NOTES = {
  main: 'Meeting with Atlas Metals Group. Elena and Mateo agreed a scope review on 10 November 2026, 10–10:30 am India time on Teams. I will organise it. Elena will send the scope document by 9 November 2026.',

};
NOTES.summary = 'We met with Elena Schmidt, Mateo Murphy and Anika Wilson from Atlas Metals Group. We agreed to review the updated technical scope with Elena and Mateo by 6 November 2026. I, Prashant Rangi, will prepare the updated scope. Anika will confirm the commercial requirements. Plant access is still unconfirmed. No pricing or close-date changes were agreed.';
const DEFAULT_INSTRUCTION = 'Capture the meeting proposal and show the evidence.';

/* ---------- provenance (prompt 12) and final details with sources (prompt 15) ---------- */
function showProvenance() {
  const evs = liveEvents();
  if (!evs.length) { aSay(...noEventBlocks()); return; }
  S.panelTab = 'evidence'; S.ui.drawer = true;
  const skip = new Set(['note']);
  const blocks = [P('Here is where each proposed detail came from. The quotes are in the Evidence tab.')];
  let anyCrm = false;
  evs.forEach(ev => {
    const groups = { user: [], derived: [], ai: [], crm: [], missing: [] };
    FIELDS.forEach(([k, l]) => {
      if (skip.has(k)) return;
      const x = ev.f[k];
      if (!x.v && k !== 'participants') { if (['location', 'organizer', 'customer', 'opportunity'].includes(k)) groups.missing.push(l); return; }
      if (k === 'participants' && !ev.people.length) { groups.missing.push(l); return; }
      (groups[x.basis] || groups.user).push(l);
    });
    if (groups.crm.length) anyCrm = true;
    const items = [
      groups.user.length ? `<strong>From your instructions:</strong> ${esc(joinAnd(groups.user))}` : null,
      groups.derived.length ? `<strong>Worked out from your instructions:</strong> ${groups.derived.map(l => { const k = FIELDS.find(f => f[1] === l)[0]; return `${esc(l)} <span class="muted">(${esc(ev.f[k].calc || 'derived')})</span>`; }).join('; ')}` : null,
      groups.ai.length ? `<strong>Composed by the assistant (assumed wording):</strong> ${esc(joinAnd(groups.ai))}. Edit it if you prefer other wording.` : null,
      `<strong>From Salesforce:</strong> ${groups.crm.length ? esc(joinAnd(groups.crm)) + ' (Verified CRM · Simulated result)' : 'Nothing. No customer check has been used for this proposal' + (ev.f.customer.v ? `, so the customer ${esc(ev.f.customer.v)} is CRM-unverified.` : '.')}`,
      `<strong>Missing:</strong> ${groups.missing.length ? esc(joinAnd(groups.missing)) + '. Not guessed.' : 'nothing required.'}`
    ].filter(Boolean);
    blocks.push(P(`<strong>${esc(evLabel(ev))}</strong>`), LIST(items));
  });
  const tzDerived = evs.some(e => e.f.tz.basis === 'derived');
  blocks.push(NOTICE('info', `<strong>Assumed:</strong> nothing was guessed. ${tzDerived ? 'The timezone was worked out from your own words, not from your profile. ' : ''}No attendee email address or meeting link was created. ${anyCrm ? '' : 'Salesforce was not searched for these proposals.'}`));
  aSay(...blocks);
}
function finalDetailsBlocks(ev) {
  const rows = FIELDS.filter(([k]) => k !== 'note').map(([k, l]) => {
    const x = ev.f[k], v = dispV(ev, k);
    if (!v) return `<strong>${esc(l)}:</strong> <em>Not provided</em>`;
    const srcs = (x.src || []).map(srcLabel).join(', '), cut = z => z.length > 80 ? z.slice(0, 77).replace(/\s+\S*$/, '') + '…' : z, q = x.calc ? cut(x.calc) : x.quote ? `“${cut(x.quote)}”` : '';
    return `<strong>${esc(l)}:</strong> ${esc(v)} <span class="muted">· ${esc(BASIS[x.basis].text)}${srcs ? ' · ' + esc(srcs) : ''}${q ? ' · ' + esc(q) : ''}</span>`;
  });
  return [P(`<strong>Final details with their sources</strong> (${esc(evLabel(ev))}, revision ${ev.rev}):`), LIST(rows)];
}

function tipVisible() { const el = $('#tip'); return !!el && !el.hidden; }

const COARSE = window.matchMedia && matchMedia('(hover: none)').matches;

function findTip(start) {

    if (n.id === 'tip' || n.id === 'printView') return null;

}

  if (top < m) top = Math.max(m, Math.min(innerHeight - h - m, r.bottom + m));
  let left = Math.max(m, Math.min(r.left, innerWidth - w - m));

}
function showTip(el, tip) {

  const box = $('#tip');
  if (tipTarget && tipTarget !== el) restoreDesc();
  tipTarget = el;
  box.innerHTML = `<strong class="tip-t">${esc(tip.t)}</strong><span class="tip-d">${esc(tip.d)}</span>${tip.p ? `<span class="tip-p"><b>Handover tip:</b> ${esc(tip.p)}</span>` : ''}<span class="tip-x">Esc to dismiss</span>`;
  box.hidden = false;

/* Hover tips stay quiet after a click or key press until the pointer really moves, so a resting

let tipQuiet = false, lastX = 0, lastY = 0, quietX = 0, quietY = 0, navAt = -1e9;
function goQuiet() { tipQuiet = true; quietX = lastX; quietY = lastY; }
function hoverEval(t) {

  if (t.closest('#tip')) { clearTimeout(tipHideT); return; }
  const f = findTip(t);
  if (!f) { scheduleHide(); return; }
  if (f.el === tipDismissed) return;
  tipDismissed = null;
  clearTimeout(tipHideT); clearTimeout(tipShowT);
  if (f.el === tipTarget && tipVisible()) return;
  tipShowT = setTimeout(() => showTip(f.el, f.tip), tipVisible() ? 90 : 380);
}
document.addEventListener('mousemove', e => {
  lastX = e.clientX; lastY = e.clientY;
  if (tipQuiet && Math.hypot(lastX - quietX, lastY - quietY) > 6) { tipQuiet = false; hoverEval(e.target); }
}, true);
if (!COARSE) {
  document.addEventListener('mouseover', e => hoverEval(e.target));
  document.addEventListener('mouseout', e => {
    const to = e.relatedTarget;
    if (to instanceof Element && (to.closest('#tip') || (tipTarget && tipTarget.contains(to)))) return;

document.addEventListener('focusin', e => {
  if (!TIPS_ON || !(e.target instanceof Element)) return;

  const f = findTip(e.target); if (!f) { hideTip(); return; }

document.addEventListener('focusout', () => scheduleHide());
document.addEventListener('mousedown', e => { lastX = e.clientX; lastY = e.clientY; if (!(e.target instanceof Element) || !e.target.closest('#tip')) { hideTip(); goQuiet(); } }, true);

window.addEventListener('resize', () => hideTip());
document.addEventListener('keydown', e => {

/* Presenter helper: the appendix prompts run as if the seller had already completed the simulated sign-in. */

const MAIN_STEPS = 10;

/* Context for each step: the goal when we arrive, and the outcome we state when the presenter moves on.

const STEP_CTX = [

const stepShort = n => n <= MAIN_STEPS ? `Step ${n}` : `Appendix ${n - MAIN_STEPS}`;
const stepGoal = n => STEP_CTX[n - 1].goal;
function stepDone(n, sub) { const c = STEP_CTX[n - 1]; return (c.vdone && c.vdone[Math.min(sub || 0, c.vdone.length - 1)]) || c.done; }
const stepLabel = n => n <= MAIN_STEPS ? `Step ${n} of ${MAIN_STEPS}` : `Appendix ${n - MAIN_STEPS} of ${STEPS.length - MAIN_STEPS}`;
function stepVariant(n) { const st = STEPS[n - 1]; if (!st.variants) return null; const v = Object.assign({}, st.variants[Math.min(S.presenter.sub || 0, st.variants.length - 1)]); v.id = v.id || (S.presenter.sub || 0) + 1; return v; }
function applyStep() {
  const n = S.presenter.step, st = STEPS[n - 1], v = stepVariant(n);
  resetWorkspace(); S.presenter.on = true;
  st.setup(v);
}
function stepText(n) { const st = STEPS[n - 1], v = stepVariant(n); return { cap: (v && v.cap) || st.cap, hood: (v && v.hood) || st.hood }; }
function goStep(n, sub, from) {
  n = Math.max(1, Math.min(STEPS.length, +n || 1));
  S.presenter.on = true; S.presenter.step = n; S.presenter.sub = sub || 0; S.ui.start = false;
  S.presenter.prev = from || null;   // set only by Next, so Back, a jump or a deep link show the goal alone
  applyStep(); render(); updateNotesWin();
  announce(`${stepLabel(n)}. ${STEPS[n - 1].t}. ${from ? `Outcome of ${stepShort(from.n)}: ${stepDone(from.n, from.sub)} ` : ''}What we are doing: ${stepGoal(n)}`);
}
function setVariant(i) { S.presenter.sub = +i; applyStep(); render(); updateNotesWin(); announce(`${STEPS[S.presenter.step - 1].t}: ${STEPS[S.presenter.step - 1].variants[+i].l}. ${stepText(S.presenter.step).cap}`); }
const pdNext = () => { const n = S.presenter.step; if (n < STEPS.length) goStep(n + 1, 0, { n, sub: S.presenter.sub || 0 }); };
const pdBack = () => { if (S.presenter.step > 1) goStep(S.presenter.step - 1); };
let AUTO = null;
function setAuto(on) {
  clearInterval(AUTO); AUTO = null; S.presenter.auto = !!on;
  if (on) AUTO = setInterval(() => { if (S.presenter.step >= MAIN_STEPS) { setAuto(false); render(); announce('Auto-play finished at the end of the main demo.'); return; } pdNext(); }, 11000);
}
function notesDl(st) {
  const v = stepText(STEPS.indexOf(st) + 1);
  const n = STEPS.indexOf(st) + 1;
  return `<dl><dt>Goal of this step</dt><dd>${esc(stepGoal(n))}</dd><dt>On screen</dt><dd>${esc(v.cap)}</dd><dt>Key point</dt><dd>${esc(st.key)}</dd><dt>Under the hood</dt><dd>${esc(v.hood)}</dd><dt>Outcome to state when you press Next</dt><dd>${esc(stepDone(n, S.presenter.sub))}</dd><dt>Say next</dt><dd>${esc(st.say)}</dd><dt>Likely question</dt><dd>${esc(st.likely)}</dd></dl>`;
}
function renderPresenter() {

  }).join('');

    <div class="pd-ctrl"><button class="btn sm" type="button" id="pd-back" data-act="pdBack" ${n === 1 ? 'aria-disabled="true"' : ''}>${ic('arrow', 'flipx')}<span>Back</span></button><button class="btn sm primary" type="button" id="pd-next" data-act="pdNext" ${n === STEPS.length ? 'aria-disabled="true"' : ''}><span>${n === MAIN_STEPS ? 'Next: appendix' : 'Next'}</span>${ic('arrow')}</button><button class="btn sm" type="button" id="pd-auto" data-act="pdAuto" aria-pressed="${!!p.auto}">${ic(p.auto ? 'pause' : 'play')}<span>${p.auto ? 'Pause auto-play' : 'Auto-play'} (P)</span></button><button class="btn sm" type="button" id="pd-notes" data-act="toggleNotes" aria-pressed="${!!(S.ui.notesPanel || (NOTES_WIN && !NOTES_WIN.closed))}"><span>Speaker notes (N)</span></button><button class="btn sm" type="button" id="pd-tech" data-act="openTech"><span>Technical inventory</span></button><button class="btn sm" type="button" id="pd-print" data-act="openPrint"><span>Print / PDF</span></button><button class="btn sm" type="button" id="pd-fs" data-act="fullscreen"><span>Full screen (F)</span></button><button class="btn sm" type="button" id="pd-close" data-act="togglePresenter"><span>Close</span></button></div></div>
    <div class="pd-row"><ol class="pd-track" aria-label="Demo steps">${trk}</ol><button type="button" class="btn sm" id="pd-ctxbtn" data-act="pdCtx" aria-expanded="${!p.ctxHide}" aria-controls="pd-ctx">${p.ctxHide ? 'Show step context' : 'Hide step context'}</button></div>

}

/* speaker notes: second window, with an in-page fallback if pop-ups are blocked */
function notesWinHtml() {
  return `<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Speaker notes · Meeting Outcome Assistant</title><style>body{font:16px/1.5 system-ui,"Segoe UI",Arial,sans-serif;margin:0;padding:16px;color:#201f1e;background:#fff}h1{font-size:19px;margin:0 0 4px}dt{font-weight:700;margin-top:14px}dd{margin:4px 0 0}.m{color:#484644;font-size:14px;margin:0 0 8px}</style></head><body><p class="m">Speaker notes · Sample data · No live CRM or calendar changes</p><h1 id="nt-title">Speaker notes</h1><div id="nt-body" aria-live="polite"></div></body></html>`;
}
function updateNotesWin() {
  if (!NOTES_WIN || NOTES_WIN.closed) { NOTES_WIN = null; return; }
  try {
    const d = NOTES_WIN.document, st = STEPS[S.presenter.step - 1];
    d.getElementById('nt-title').textContent = `${stepLabel(S.presenter.step)} · ${st.t}`;
    d.getElementById('nt-body').innerHTML = notesDl(st);
  } catch (e) { /* the window was closed or navigated away */ }
}
function toggleNotes() {
  if (NOTES_WIN && !NOTES_WIN.closed) { NOTES_WIN.close(); NOTES_WIN = null; render(); return; }
  if (S.ui.notesPanel) { S.ui.notesPanel = false; render(); const b = $('#pd-notes'); if (b) b.focus(); return; }
  let w = null;
  try { w = window.open('', 'moa_speaker_notes', 'popup=yes,width=520,height=700'); } catch (e) { w = null; }
  if (!w || w.closed) {
    S.ui.notesPanel = true; render(); toast('Pop-ups are blocked, so the speaker notes are shown in the page instead. Press Esc to close them.');
    const b = $('#notesClose'); if (b) b.focus(); return;
  }
  NOTES_WIN = w;
  try { w.document.open(); w.document.write(notesWinHtml()); w.document.close(); } catch (e) { /* ignore */ }
  updateNotesWin(); render();
}
function toggleFullscreen() {
  try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (e) { toast('Full screen is not available in this browser.'); }
}

  page('Capability inventory', `<h1>Capability inventory</h1><div class="pcols" style="grid-template-columns:repeat(3,1fr)">${[[INVENTORY[0]], [INVENTORY[1], INVENTORY[2]], [INVENTORY[3], INVENTORY[4]]].map(col => `<div>${col.map(g => `<div style="margin-bottom:8px">${rb(g.badge)}<h2>${esc(g.title)}</h2><ul>${g.items.map(i => `<li>${esc(i)}</li>`).join('')}</ul><p class="small muted" style="margin:3px 0 0">${esc(g.note)}</p></div>`).join('')}</div>`).join('')}</div>`);

    <p class="small muted" style="margin:4px 0">This is what is configured. It does not claim every function was independently retested in this Events phase.</p>

}

/* ==========================================================================

function announceLast() {
  const m = S.chat.slice().reverse().find(x => x.role === 'assistant'); if (!m) return;
  const parts = [];
  for (const b of m.blocks) { if (b.html) parts.push(stripHtml(b.html)); else if (b.t === 'q') parts.push(stripHtml(b.text)); else if (b.t === 'event') parts.push(`${b.title}, ${STATUS[b.status].t}`); if (parts.join(' ').length > 140) break; }
  if (parts.length) announce(parts.join(' ').slice(0, 320));
}
function say(label, fn) { userSay(label); fn(); }

  loadInject() { S.ui.help = false; S.route = 'meeting'; S.meetingTab = 'capture'; S.notes = NOTES.inject; S.capErr = ''; S.captured = false; S.proc = null; S.notesKind = null; },

  closeDrawers() { closeDialogs(); return false; },
  openHelp() { openDialog('help'); return false; },
  openTech() { openDialog('tech'); return false; },
  edit(el) { S.ui.edit = { n: +el.dataset.n, k: el.dataset.k }; S.ui.editErr = ''; setTimeout(() => { const i = $('#edit-input'); if (i) i.focus(); }, 0); },
  editCancel() { const k = S.ui.edit && S.ui.edit.k; S.ui.edit = null; S.ui.editErr = ''; setTimeout(() => { const b = $(`[data-fid="edit-${k}"]`); if (b) b.focus(); }, 0); },
  markReviewed(el) { const ev = evByN(el.dataset.n); if (!ev) return; say('Mark reviewed — keep unsaved', () => markReviewed(ev, 'Mark reviewed — keep unsaved')); announceLast(); },
  unreview(el) { const ev = evByN(el.dataset.n); if (!ev) return; ev.reviewed = false; aSay(P(`Review status removed from Event ${ev.n}. It is still unsaved.`), evCard(ev)); },
  revise(el) { const ev = evByN(el.dataset.n); if (!ev) return; say('Revise details', () => { aSay(P('Tell me what to change, or use <strong>Edit</strong> beside a field. Your correction becomes the evidence for that field.'), CHIPS(['Move it to 3 pm and keep it 30 minutes.', 'Add Anika to the proposed attendees.', 'Keep the customer unverified.'])); }); S.activeEv = ev.n; S.panelTab = 'event'; },
  showEvidence(el) { const ev = evByN(el.dataset.n); if (ev) S.activeEv = ev.n; userSay('Show the evidence.'); showEvidence(); announceLast(); },
  discardEv(el) { const ev = evByN(el.dataset.n); if (!ev || ev.discarded) return; say('Discard proposal', () => doDiscard(ev)); announceLast(); },
  restore(el) { restoreEvent(+el.dataset.n); announceLast(); },
  futureBtn(el) { const m = `${el.dataset.what}: Future scope — unavailable in this phase. Nothing was saved or sent.`; toast(m); announce(m); return false; },
  pausedWhy(el) { S.ui.pausedWhy = el.dataset.what; setTimeout(() => { const r = $('#pausedReason'); if (r) r.focus(); }, 0); announce('Unavailable. Task fixes are pending and nothing was created.'); },
  lk(el) { lkAction(el.dataset.a, el.dataset.id); announceLast(); },

  simLink() { toast('Simulated link. This wireframe does not open records.'); return false; },
  reset() {
    stopAll(); resetWorkspace(); S.route = 'home'; closeAllFloating(); S.presenter.step = 1; S.presenter.sub = 0; S.presenter.prev = null;
    render(); toast('Demo reset to the starting sample state.'); announce('Demo reset to the starting sample state.'); const m = $('#pgtitle'); if (m) m.focus({ preventScroll: true }); return false;
  },
  togglePresenter() { if (S.presenter.on) { setAuto(false); S.presenter.on = false; S.ui.notesPanel = false; if (NOTES_WIN && !NOTES_WIN.closed) NOTES_WIN.close(); NOTES_WIN = null; } else { goStep(S.presenter.step || 1); return false; } },

  startExplore() { S.ui.start = false; S.route = 'home'; setTimeout(() => { const h = $('#pgtitle'); if (h) h.focus(); }, 0); },
  startCapability() { S.ui.start = false; S.route = 'capability'; S.capTab = 'overview'; setTimeout(() => { const h = $('#pgtitle'); if (h) h.focus(); }, 0); },
  openPrint() { S.ui.help = S.ui.tech = false; showPrint(true); return false; },

function stopAll() { setAuto(false); }
function closeAllFloating() { S.ui.notesPanel = false; if (NOTES_WIN && !NOTES_WIN.closed) { try { NOTES_WIN.close(); } catch (e) { /* ignore */ } } NOTES_WIN = null; S.ui.print = false; document.body.classList.remove('print-preview'); S.presenter.on = false; }

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  if (el.disabled) return;
  const fn = ACTIONS[el.dataset.act]; if (!fn) return;
  if (el.tagName === 'A') e.preventDefault();
  const r = fn(el, e);
  if (r !== false) render();
});
document.addEventListener('submit', e => {
  const f = e.target; e.preventDefault();
  if (f.id === 'cform') {
    const i = $('#msgInput'), v = i.value.trim(); if (!v) return;
    i.value = ''; handleUserText(v); render(); announceLast(); i.focus();
  } else if (f.dataset.form === 'edit') {
    const ev = evByN(f.dataset.n), k = f.dataset.k; if (!ev) return;
    const val = f.elements.val.value, keep = f.elements.keep ? f.elements.keep.checked : false;
    const res = applyFieldEdit(ev, k, val, keep);
    if (res.err) { S.ui.editErr = res.err; render(); const i = $('#edit-input'); if (i) i.focus(); return; }
    S.ui.edit = null; S.ui.editErr = ''; S.activeEv = ev.n; S.panelTab = 'changes'; render(); announceLast();
    setTimeout(() => { const b = $(`[data-fid="edit-${k}"]`); if (b) b.focus(); }, 0);
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'notesInput') { S.notes = e.target.value; if (S.capErr) { S.capErr = ''; const c = $('#capErr'); if (c) c.remove(); } }
  else if (e.target.id === 'instrInput') S.instruction = e.target.value;
});
document.addEventListener('change', e => {
  if (e.target.id === 'scenSel') {
    const v = e.target.value; if (!v) return;
    setAuto(false); const wasOn = S.presenter.on; loadScenario(v); S.ui.start = false; S.presenter.on = wasOn;
    render(); announce(`Scenario loaded: ${SCEN_NAMES[v] || v}`);
  }
});

/* The demo prompts menu opens as a popover under its button and is kept on screen. */
function placePlib() {
  const sm = $('#plibSum'), pn = $('.plib-panel'); if (!sm || !pn) return;
  const r = sm.getBoundingClientRect(), w = Math.min(560, innerWidth - 16);
  pn.style.width = w + 'px';
  pn.style.left = Math.max(8, Math.min(r.right - w, innerWidth - w - 8)) + 'px';
  pn.style.top = (r.bottom + 6) + 'px';
  pn.style.maxHeight = Math.max(200, innerHeight - r.bottom - 22) + 'px';
}
document.addEventListener('toggle', e => { if (e.target && e.target.id === 'plib' && e.target.open) placePlib(); }, true);
addEventListener('resize', () => { const d = $('#plib'); if (d && d.open) placePlib(); });
document.addEventListener('click', e => { const d = $('#plib'); if (d && d.open && !d.contains(e.target)) d.open = false; });

/* keyboard: tabs, dialogs, presenter keys */
document.addEventListener('keydown', e => {
  const t = e.target;
  if (e.key === 'Escape') {
    const pl = $('#plib'); if (pl && pl.open) { pl.open = false; const sm = $('#plibSum'); if (sm) sm.focus(); return; }
    if (S.ui.notesPanel) { S.ui.notesPanel = false; render(); const b = $('#pd-notes'); if (b) b.focus(); return; }
    if (S.ui.help || S.ui.tech) { closeDialogs(); return; }
    if (S.ui.print) { showPrint(false); return; }
    if (S.ui.start) { ACTIONS.startExplore(); render(); return; }
    if (S.ui.edit) { ACTIONS.editCancel(); render(); return; }
    if (S.route === 'events' && S.ui.drawer && matchMedia('(max-width:1180px)').matches) { S.ui.drawer = false; render(); const b = $('#btnDetails'); if (b) b.focus(); return; }
    return;
  }
  if (e.key === 'Tab') {
    const box = S.ui.start ? $('#startOverlay') : S.ui.help ? $('#helpDrawer') : S.ui.tech ? $('#techDrawer') : null;
    if (box) {
      const f = focusables(box); if (!f.length) return;
      if (!box.contains(document.activeElement)) { e.preventDefault(); f[0].focus(); return; }
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
    return;
  }
  if (t.matches && t.matches('[role="tab"]') && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
    const list = t.closest('[role="tablist"]'), tabs = $$('[role="tab"]', list), i = tabs.indexOf(t);
    const j = e.key === 'Home' ? 0 : e.key === 'End' ? tabs.length - 1 : (i + (e.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
    e.preventDefault(); const id = tabs[j].id; tabs[j].click(); const n = document.getElementById(id); if (n) n.focus(); return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (t.matches && t.matches('input,textarea,select,[contenteditable="true"]')) return;
  if (!S.presenter.on || S.ui.start || S.ui.help || S.ui.tech || S.ui.print) return;
  const k = e.key;
  if (k === 'PageDown' || (k === 'ArrowRight' && !(t.matches && t.matches('[role="tab"]')))) { e.preventDefault(); pdNext(); }
  else if (k === 'PageUp' || (k === 'ArrowLeft' && !(t.matches && t.matches('[role="tab"]')))) { e.preventDefault(); pdBack(); }
  else if (k === 'p' || k === 'P') { e.preventDefault(); setAuto(!S.presenter.auto); render(); announce(S.presenter.auto ? 'Auto-play on' : 'Auto-play off'); }
  else if (k === 'n' || k === 'N') { e.preventDefault(); toggleNotes(); }
  else if (k === 'f' || k === 'F') { e.preventDefault(); toggleFullscreen(); }
});
window.addEventListener('beforeprint', () => { if (!$('#printView').children.length) buildPrint(); });
window.addEventListener('resize', () => { if (S.route === 'events' && !matchMedia('(max-width:1180px)').matches && S.ui.drawer) { S.ui.drawer = false; render(); } });

/* ==========================================================================
   Deep links (hash) and start-up
   ========================================================================== */
let LAST_HASH = null;
function currentHash() {
  if (S.ui.print) return '#print';
  if (S.presenter.on) return '#step=' + S.presenter.step;
  if (S.route === 'capability') return '#capability/' + S.capTab;
  return '#' + S.route;
}
function syncHash() {
  if (S.ui.start) return;
  const h = currentHash(); if (h === LAST_HASH) return;
  LAST_HASH = h; try { history.replaceState(null, '', h); } catch (e) { /* file or sandboxed frame */ }
}
function applyHash(initial) {
  const raw = decodeURIComponent((location.hash || '').replace(/^#\/?/, ''));
  if (!raw) { if (initial) S.ui.start = true; return; }
  let m;
  S.ui.start = false;
  if (raw === 'print') { showPrint(true); return; }
  if ((m = raw.match(/^step=(\d+)$/))) { goStep(+m[1]); return; }
  if ((m = raw.match(/^scenario=([A-Za-z0-9]+)$/)) && (SCEN_NAMES[m[1]])) { loadScenario(m[1]); return; }
  m = raw.split('/');
  if (['home', 'meeting', 'events', 'capability'].includes(m[0])) { S.route = m[0]; if (m[0] === 'capability' && CAP_TABS.some(t => t[0] === m[1])) S.capTab = m[1]; return; }
  if (initial) S.ui.start = true;
}
window.addEventListener('hashchange', () => {
  const h = location.hash; if (h === LAST_HASH) return;
  if (S.ui.print && h !== '#print') showPrint(false);
  setAuto(false); const wasPrint = S.ui.print; applyHash(false);
  if (!S.ui.print && !wasPrint) render();
});
function init() {
  $('#waffle').innerHTML = ic('waffle', 'waffle'); $('#bannerIcon').innerHTML = ic('info');
  applyHash(true);
  render();
  if (S.ui.start) { const b = $('#startGuided'); if (b) b.focus(); }
}
init();
