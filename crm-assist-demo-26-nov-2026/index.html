<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRM Assist click-through</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%234c9aff%22/%3E%3Cpath d=%22m12 9 9 7-9 7z%22 fill=%22%230b1426%22/%3E%3C/svg%3E">
<style>
/* VOICE: calm, confident product walkthrough for a sales audience.
   IDEA: a presenter's control booth: the recording is the stage, everything else frames it.
   PICTURE: the recording itself, zoomed and spotlit at each step; topic cards between sections.
   COLOUR and TYPE: deep navy stage, one blue accent, warm amber only for fast-forward; Inter.
   LAYOUT: top bar (chapter rail), stage centre, caption bar and controls below. */
:root{color-scheme:dark;--bg:#0b1426;--bg2:#101d36;--panel:#14233f;--line:#2a3d63;--ink:#eef3fb;--mut:#a9b8d2;--acc:#4c9aff;--acc2:#8fc0ff;--ff:#ffb040;--ok:#3ecf8e}
[hidden]{display:none!important}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) auto;height:100%}
/* top bar */
.top{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--bg2)}
.brand{font-weight:700;font-size:15px;white-space:nowrap}
.brand small{display:block;font-weight:500;color:var(--mut);font-size:12.5px}
.rail{display:flex;gap:6px;overflow-x:auto;flex:1;padding:2px;scrollbar-width:thin}
.rail button{flex:none;display:flex;align-items:center;gap:7px;min-height:40px;padding:6px 11px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--mut);font-size:13.5px}
.rail button .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:#1d2f52;color:var(--ink);font-size:12px;font-weight:700}
.rail button[aria-current="step"]{border-color:var(--acc);color:var(--ink);background:#16294a}
.rail button[aria-current="step"] .n{background:var(--acc);color:#06132b}
.rail button.done .n{background:#24416f}
.rail .chap{flex:none;align-self:center;color:var(--mut);font-size:12px;font-weight:600;padding:0 4px 0 10px;border-left:1px solid var(--line);white-space:nowrap}
.rail .chap:first-child{border-left:0;padding-left:0}
.icon{width:20px;height:20px;flex:none}
/* stage */
.stagewrap{position:relative;display:grid;place-items:center;padding:14px;overflow:hidden}
.stage{position:relative;width:min(100%,calc((100vh - 230px) * 1760 / 918));aspect-ratio:1760/918;border-radius:14px;overflow:hidden;background:#0b1426;box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.07)}
.zoom{position:absolute;inset:0;transform-origin:0 0;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.zoom video{position:absolute;inset:0;width:100%;height:100%;display:block}
.spot{position:absolute;border:3px solid var(--acc2);border-radius:10px;box-shadow:0 0 0 9999px rgba(4,10,22,.55),0 0 24px rgba(76,154,255,.55);pointer-events:none;opacity:0;transition:opacity .45s,left .9s,top .9s,width .9s,height .9s}
.spot.on{opacity:1}
.spot.lite{box-shadow:0 0 0 9999px rgba(4,10,22,.18),0 0 24px rgba(76,154,255,.55)}
.badge{position:absolute;top:12px;right:12px;display:flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:var(--ff);color:#241500;font-weight:700;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
.badge.on{opacity:1}
.pausechip{position:absolute;top:12px;left:12px;padding:5px 11px;border-radius:999px;background:rgba(11,20,38,.82);border:1px solid var(--line);color:var(--mut);font-size:13px;pointer-events:none}
/* cards (title, topic, end) */
.card{position:absolute;inset:14px;border-radius:14px;overflow:auto;container-type:size;display:grid;place-items:center;padding:3% 5%;box-shadow:0 18px 50px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.07);background:radial-gradient(circle at 85% 10%,rgba(76,154,255,.22),transparent 45%),radial-gradient(circle at 8% 100%,rgba(60,110,210,.18),transparent 40%),linear-gradient(135deg,#0a1325,#13254a);z-index:5}
.card .inner{width:100%;max-width:1060px}
.peek{display:none;margin:0}
.peek img{display:block;width:100%;max-height:62cqh;object-fit:cover;object-position:top;border-radius:12px;box-shadow:0 22px 50px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.12);transform:perspective(1200px) rotateY(-7deg) rotateZ(.6deg)}
.peek figcaption{margin-top:10px;color:var(--mut);font-size:13px}
@container (min-width:820px){.inner.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:4.5cqw;align-items:center;max-width:none}.peek{display:block}}
.kick{color:var(--acc2);font-weight:700;font-size:clamp(12px,min(1.6cqw,3cqh),16px);letter-spacing:.04em}
.card h1,.card h2{margin:.2em 0 .3em;font-size:clamp(20px,min(4.6cqw,8.5cqh),52px);line-height:1.08;text-wrap:balance}
.card p{margin:0 0 .9em;color:#c8d4ea;font-size:clamp(14px,min(1.9cqw,3.6cqh),20px);max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 1.2em;padding:0;list-style:none}
.chips li{padding:4px 12px;border-radius:999px;border:1px solid #35507f;background:rgba(20,35,63,.8);font-size:clamp(12px,min(1.5cqw,2.8cqh),15px);color:#dbe6f7}
.secnum{display:flex;align-items:baseline;gap:14px}
.secnum b{font-size:clamp(34px,min(8cqw,15cqh),96px);line-height:1;color:var(--acc)}
.secnum span{color:#b6c4dc;font-weight:600;font-size:clamp(12px,min(1.6cqw,3cqh),16px)}
.dots{display:flex;gap:7px;margin:0 0 1.1em}
.dots i{width:9px;height:9px;border-radius:50%;background:#2c4470}
.dots i.d{background:#6f8fc4}.dots i.c{width:24px;border-radius:5px;background:var(--acc)}
.primary{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:10px 22px;border:0;border-radius:12px;background:var(--acc);color:#05112a;font-weight:700;font-size:16px}
.primary[disabled]{opacity:.6;cursor:wait}
.ghost{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border:1px solid var(--line);border-radius:12px;background:transparent;font-weight:600}
.recap{list-style:none;margin:0 0 1em;padding:0;display:grid;gap:min(10px,1.6cqh)}
.recap li{display:flex;gap:12px;align-items:flex-start;font-size:clamp(14px,min(2cqw,3.7cqh),20px)}
.recap li svg{flex:none;margin-top:3px}
.legend{margin-top:1em;font-size:13px;color:var(--mut)}
.endnav{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 1em;padding:0;list-style:none}
.endnav button{min-height:32px;border:0;background:none;padding:0;color:var(--acc2);font-size:clamp(12px,min(1.5cqw,2.7cqh),15px);text-decoration:underline;text-underline-offset:3px}
.cardbtns{display:flex;flex-wrap:wrap;gap:10px}
/* caption + controls */
.bottom{border-top:1px solid var(--line);background:var(--bg2);padding:10px 18px 12px;display:grid;gap:10px}
.capline{display:flex;gap:14px;align-items:flex-start;min-height:52px}
.where{flex:none;padding:4px 10px;border-radius:8px;background:#1b2d50;color:var(--acc2);font-weight:700;font-size:13px;white-space:nowrap;margin-top:2px}
.cap{margin:0;font-size:clamp(15px,1.35vw,19px);line-height:1.4;max-width:110ch}
.ctrls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.ctrls .sp{flex:1}
.ctrls button{min-height:44px}
.prog{height:4px;border-radius:2px;background:#22355a;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--acc)}
.switch{display:inline-flex;align-items:center;gap:8px;color:var(--mut);font-size:14px;min-height:44px;padding:0 6px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--acc)}
.keys{color:var(--mut);font-size:13px}
/* notes panel and tips */
.notes{position:fixed;right:16px;bottom:120px;width:min(420px,calc(100vw - 32px));max-height:60vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:0 18px 40px rgba(0,0,0,.5);z-index:20}
.notes h3{margin:0 0 6px;font-size:15px}.notes p{margin:0 0 10px;font-size:14px;color:#d5def0}
.notes .x{float:right;min-height:36px}
.tip{position:fixed;z-index:30;max-width:320px;padding:10px 12px;border-radius:10px;background:#f4f7fd;color:#0b1426;font-size:13.5px;line-height:1.4;box-shadow:0 10px 30px rgba(0,0,0,.45);pointer-events:auto}
.tip b{display:block;margin-bottom:2px}
.rotate{display:none}
@media (max-height:520px){.keys,.prog{display:none}.capline{min-height:0}.cap{font-size:14px}.bottom{padding:6px 10px;gap:6px}.top{padding:6px 10px}.ctrls{gap:6px}.ctrls button,.ctrls .ghost,.switch{min-height:40px}.stagewrap{padding:8px}.card{inset:8px}}
@media (max-width:600px){.endnav{display:none}}
@media (max-width:760px){.brand small,.keys{display:none}.top{padding:8px 10px}.bottom{padding:8px 10px}.where{display:none}}
@media (max-width:600px) and (orientation:portrait){.rotate{display:block;position:fixed;left:10px;right:10px;bottom:10px;z-index:25;padding:8px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13px;color:var(--mut)}}
@media (prefers-reduced-motion:reduce){.zoom,.spot{transition:none!important}}
@media print{@page{size:A4 landscape;margin:12mm}html,body{overflow:visible!important;height:auto!important;background:#fff}.app,.notes,.tip,.rotate{display:none!important}.print{display:block!important}}
html.printmode,html.printmode body{overflow:auto;height:auto;background:#fff}html.printmode .app{display:none}html.printmode .print{display:block}
.print{display:none;color:#0b1426;background:#fff;font-size:13px;padding:12px}
.print .noprint{display:flex;gap:12px;align-items:center;color:#334}.print .back2{color:#0b1426;border-color:#99a}
@media print{.print .noprint{display:none!important}}
a.ghost{text-decoration:none;color:var(--ink)}
.print section{break-after:page;padding:8px 4px}
.print h2{margin:0 0 6px;font-size:22px}.print p{margin:0 0 6px;max-width:none}.print .pk{color:#3a5a8c;font-weight:700;font-size:12px}.print .pn{color:#334}
.print .pg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:8px}
.print figure{margin:0;break-inside:avoid}.print img{width:100%;border:1px solid #ccd;border-radius:6px;display:block}.print figcaption{font-size:12px;line-height:1.35;margin-top:4px}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">CRM Assist<small>Click-through demo</small></div>
    <nav class="rail" id="rail" aria-label="Sections"></nav>
  </header>
  <main class="stagewrap">
    <div class="stage" id="stage">
      <div class="zoom" id="zoom"><video id="vid" playsinline muted preload="auto" aria-label="Demo recording"></video></div>
      <div class="spot" id="spot"></div>
      <div class="badge" id="badge"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 4l7 6-7 6zM10 4l7 6-7 6z" fill="currentColor"/></svg><span>Fast-forward</span></div>
      <div class="pausechip" id="pausechip" hidden>Paused</div>
    </div>
    <div class="card" id="card"></div>
  </main>
  <footer class="bottom">
    <div class="capline"><span class="where" id="where">Start</span><p class="cap" id="cap" aria-live="polite"></p></div>
    <div class="prog" aria-hidden="true"><i id="progbar"></i></div>
    <div class="ctrls">
      <button class="ghost" id="back" type="button"><svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.5 4 6.5 10l6 6" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>Back</button>
      <button class="primary" id="next" type="button">Continue<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m7.5 4 6 6-6 6" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg></button>
      <button class="ghost" id="skip" type="button" hidden>Skip ahead</button>
      <span class="sp"></span>
      <label class="switch" id="autolbl"><input type="checkbox" id="auto"> Auto-play</label>
      <button class="ghost" id="notesbtn" type="button" aria-expanded="false">Notes</button>
      <label class="switch" id="tipslbl"><input type="checkbox" id="tips" checked> Guide tips</label>
      <button class="ghost" id="restart" type="button">Restart</button>
      <a class="ghost" id="printlink" href="#print">Print view</a>
      <span class="keys">Space or → continue · ← back · N notes · P auto-play</span>
    </div>
  </footer>
</div>
<aside class="notes" id="notes" hidden aria-label="Presenter notes"></aside>
<div class="tip" id="tip" role="tooltip" hidden></div>
<div class="rotate" id="rotate">Tip: turn your phone sideways for a bigger view.</div>
<div class="print" id="print"></div>

fuses to move the stage while data checks are open.","chips":["Handwritten notes","Read-only lookup","Stage held"],"start":273.2333,"notes":["Copilot follows the stated rule: no stage change until data readiness is confirmed.","Does it read handwriting? It read this photo; validate accuracy on your own notes."],"stops":[29,30,31,32,33]},{"topic":"Draft the Phase 2 opportunity safely","desc":"Asked to create the Phase 2 opportunity, Copilot prepares it but saves nothing until the required close date is provided.","chips":["Required field","Nothing saved","Draft kept"],"start":302.8333,"notes":["Required fields are respected: nothing is created until the close date is given.","Is the draft saved anywhere? Only in the conversation, as Copilot states."],"stops":[34,35]},{"topic":"Ask Copilot to change a close date","desc":"On a different deal, the seller dictates one change: move the Harborlight pilot's close date. Copilot finds the record and proposes the change.","chips":["Harborlight","Dictated request","Proposed change"],"start":328.1,"notes":["A single dictated sentence is matched to the right record.","How does it pick the record? It names the opportunity and account it found before proposing."],"stops":[36,37,38]},{"topic":"Confirm, update and verify","desc":"The exact field update is confirmed before it runs. Copilot verifies the result, and the new date appears on the Salesforce record.","chips":["Field-level confirm","Verified update","Stage unchanged"],"start":351.2667,"notes":["Every write is confirmed at field level and verified afterwards.","Can other fields change by accident? Copilot reports that no other values changed."],"stops":[39,40,41]}],"stops":[{"t":0.5167,"frame":15,"sec":0,"rect":[202.1,103.7,918.6,479.1],"phone":false,"cap":"A customer email arrives: GreenGrid wants to cut energy costs and improve uptime at its Chennai plant, and asks about a pilot."},{"t":15.5167,"frame":465,"sec":0,"rect":[841.4,351.7,918.6,479.1],"phone":false,"cap":"From t 67],[217.6,223.533],[225.167,226.6],[228.6,230.567],[243.833,244.933],[245.167,249.233],[251.2,252.4],[274.2,276.267],[279.3,285.533],[285.933,290.1],[307.833,313.133],[321.133,322.4],[330.6,334.1],[337.0,342.767],[343.3,347.733],[354.1,357.233],[362.033,363.133]],"end":{"title":"What we covered","points":["Email to account, opportunity, meeting and Teams deal room","Meeting debrief on mobile turned into Salesforce tasks","Copilot holds the stage until data readiness is confirmed","Every Copilot change to Salesforce is shown and confirmed first"]}}</script>
<script>
{
'use strict';
const C = JSON.parse(document.getElementById('cues').textContent);
const VIDEO_SRC = 'crm-assist-demo.mp4';
const $ = id => document.getElementById(id);
const vid = $('vid'), zoom = $('zoom'), spot = $('spot'), card = $('card'), cap = $('cap'), where = $('where');
const S = C.sections, ST = C.stops, N = S.length;
const RM = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// States: {k:'title'} | {k:'topic', s} | {k:'stop', i} | {k:'end'}
const states = [{k:'title'}];
S.forEach((sec, si) => { states.push({k:'topic', s:si}); sec.stops.forEach(i => states.push({k:'stop', i, s:si})); });
states.push({k:'end'});
let cur = 0, playing = false, target = null, loaded = false, raf = 0;

// ---------- video loading (Blob first: some hosts do not support seeking by range)
async function load() {
  const btn = document.querySelector('#card .primary');
  try {
    if (location.protocol === 'file:') throw new Error('local file');
    const r = await fetch(VIDEO_SRC);
    if (!r.ok) throw new Error('fetch ' + r.status);
    const total = +r.headers.get('content-length') || 0;
    const rd = r.body.getReader(); const parts = []; let got = 0;
    for (;;) { const {done, value} = await rd.read(); if (done) break; parts.push(value); got += value.length;
      if (total && btn) btn.textContent = 'Loading video… ' + Math.round(got * 100 / total) + '%'; }
    vid.src = URL.createObjectURL(new Blob(parts, {type: 'video/mp4'}));
  } catch (e) { vid.src = VIDEO_SRC; }
  await new Promise(res => { if (vid.readyState >= 2) res(); else vid.addEventListener('loadeddata', res, {once: true}); });
  loaded = true; render();
}

// ---------- zoom / spotlight
function frameRect() { return $('stage').getBoundingClientRect(); }
function setZoom(r, phone) {
  const sw = frameRect().width, k = sw / C.w;
  if (!r) { zoom.style.transform = 'none'; spot.classList.remove('on'); return; }
  let [x, y, w, h] = r;
  if (phone) { zoom.style.transform = 'none'; spot.classList.add('lite'); placeSpot(x, y, w, h, k); return; }
  spot.classList.remove('lite');
  const pad = 0.10; x -= w * pad; y -= h * pad; w *= 1 + 2 * pad; h *= 1 + 2 * pad;
  const z = Math.max(1, Math.min(C.w / w, C.h / h, 2.2));
  let tx = -x * z + (C.w - w * z) / 2, ty = -y * z + (C.h - h * z) / 2;
  tx = Math.min(0, Math.max(C.w - C.w * z, tx)); ty = Math.min(0, Math.max(C.h - C.h * z, ty));
  zoom.style.transform = `translate(${tx * k}px,${ty * k}px) scale(${z})`;
  const sx = (r[0] * z + tx), sy = (r[1] * z + ty);
  placeSpot(sx, sy, r[2] * z, r[3] * z, k);
}
function placeSpot(x, y, w, h, k) {
  const m = 6;
  Object.assign(spot.style, {left: (x * k - m) + 'px', top: (y * k - m) + 'px', width: (w * k + 2 * m) + 'px', height: (h * k + 2 * m) + 'px'});
  spot.classList.add('on');
}

// ---------- rendering of the current state
function stopOf(i) { return ST[i]; }
function secLabel(si) { return `Section ${si + 1} of ${N}`; }
function render() {
  const st = states[cur];
  document.querySelectorAll('#rail button[data-s]').forEach(b => {
    const si = +b.dataset.s, on = (st.s === si);
    b.setAttribute('aria-current', on ? 'step' : 'false');
    b.classList.toggle('done', st.s !== undefined ? si < st.s : st.k === 'end');
  });
  $('railhome').setAttribute('aria-current', st.k === 'title' ? 'step' : 'false');
  const curB = document.querySelector('#rail [aria-current="step"]'); if (curB) curB.scrollIntoView({block: 'nearest', inline: 'nearest', behavior: RM ? 'auto' : 'smooth'});
  hideTip();
  $('railend').setAttribute('aria-current', st.k === 'end' ? 'step' : 'false');
  $('back').disabled = cur === 0;
  $('progbar').style.width = (cur / (states.length - 1) * 100) + '%';
  $('pausechip').hidden = !(st.k === 'stop' && !playing);
  if (st.k === 'title') return showTitle();
  if (st.k === 'topic') return showTopic(st.s);
  if (st.k === 'end') return showEnd();
  card.hidden = true;
  const s = stopOf(st.i), secStops = S[st.s].stops, n = secStops.indexOf(st.i) + 1;
  where.textContent = `${st.s + 1}.${n}`;
  cap.textContent = s.cap;
  $('next').lastChild.previousSibling && null;
  if (!playing) { vid.pause(); snap(s.t); setZoom(s.rect, s.phone); }
  syncNotes();
}
function snap(t) { if (Math.abs(vid.currentTime - t) > 0.02) vid.currentTime = t; }
function showTitle() {
  setZoom(null); vid.pause();
  card.hidden = false;
  card.innerHTML = `<div class="inner split"><div><div class="kick">${esc(C.title.kicker)}</div><h1>${esc(C.title.title)}</h1>
    <p>${esc(C.title.lede)}</p><ul class="chips">${C.title.chips.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
    <button class="primary" type="button" ${loaded ? '' : 'disabled'} data-act="start">${loaded ? 'Start the demo' : 'Loading video…'}</button>
    <p class="legend">${N} sections · about 8 minutes at a steady pace · Recorded in a demo environment.</p></div>
    ${peek(5, 'First stop: Copilot summarizes the customer email with CRM context')}</div>`;
  where.textContent = 'Start'; cap.textContent = 'Press Start, Continue or the right arrow to begin.';
  if (loaded) setTimeout(() => card.querySelector('.primary')?.focus({preventScroll: true}), 30);
  syncNotes();
}
function showTopic(si) {
  const sec = S[si]; setZoom(null); vid.pause(); snap(sec.start + 0.02);
  card.hidden = false;
  card.innerHTML = `<div class="inner split"><div><div class="secnum"><b>${String(si + 1).padStart(2, '0')}</b><span>${secLabel(si)} · ${esc(chapterOf(si))}</span></div>
    <h2>${esc(sec.topic)}</h2><p>${esc(sec.desc)}</p><ul class="chips">${sec.chips.map(c => `<li>${esc(c)}</li>`).join('')}</ul>
    <div class="dots" aria-hidden="true">${S.map((_, k) => `<i class="${k === si ? 'c' : k < si ? 'd' : ''}"></i>`).join('')}</div>
    <button class="primary" type="button" data-act="next">Show me</button></div>
    ${peek(sec.stops[sec.stops.length - 1], 'Where this section ends up')}</div>`;
  where.textContent = 'Up next';
  cap.textContent = `${secLabel(si)}: ${sec.topic}. ${sec.stops.length} steps.`;
  syncNotes();
}
function showEnd() {
  setZoom(null); vid.pause(); card.hidden = false;
  const tick = '<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><circle cx="11" cy="11" r="10" fill="none" stroke="#4c9aff" stroke-width="2"/><path d="m6.5 11.5 3 3 6-6.5" fill="none" stroke="#4c9aff" stroke-width="2.4" stroke-linecap="round"/></svg>';
  card.innerHTML = `<div class="inner"><div class="kick">Recap</div><h2>${esc(C.end.title)}</h2>
    <ul class="recap">${C.end.points.map(p => `<li>${tick}<span>${esc(p)}</span></li>`).join('')}</ul>
    <ul class="endnav" aria-label="Revisit a section">${S.map((s, k) => `<li><button type="button" data-go="${k}">${k + 1}. ${esc(s.topic)}</button></li>`).join('')}</ul>
    <div class="cardbtns"><button class="primary" type="button" data-act="replay">Replay from the start</button><button class="ghost" type="button" data-act="last">Back to the last step</button></div></div>`;
  where.textContent = 'End'; cap.textContent = 'That is the end of the walkthrough. Pick any section to revisit it.';
  syncNotes();
}
function peek(i, label) { return `<figure class="peek"><img src="thumbs/${String(i + 1).padStart(2, '0')}.jpg" alt="Preview: ${esc(ST[i].cap)}" loading="lazy"><figcaption>${esc(label)}</figcaption></figure>`; }
function chapterOf(si) { return (C.chapters.find(c => c.secs.includes(si)) || {}).name || ''; }

// ---------- navigation
function go(i, fromNext) {
  i = Math.max(0, Math.min(states.length - 1, i));
  const st = states[i], prev = states[cur];
  stopPlay();
  // forward from a stop (or topic) to the next stop plays the recording
  if (fromNext && st.k === 'stop' && loaded) {
    const from = prev.k === 'stop' ? stopOf(prev.i).t : prev.k === 'topic' ? S[prev.s].start : null;
    const to = stopOf(st.i).t;
    if (from !== null && to > from) { cur = i; playTo(from, to); render(); setHash(); return; }
  }
  cur = i; render(); setHash();
}
function next() { if (states[cur].k === 'title' && !loaded) return; go(cur + 1, true); }
function back() { go(cur - 1, false); }
function playTo(from, to) {
  playing = true; target = to; card.hidden = true;
  setZoom(null); snap(from); $('skip').hidden = false;
  cap.textContent = cap.textContent; // keep caption of the step we are moving to
  const s = stopOf(states[cur].i); cap.textContent = s.cap;
  vid.playbackRate = 1;
  const p = vid.play(); if (p && p.catch) p.catch(() => {});
  cancelAnimationFrame(raf); raf = requestAnimationFrame(tick);
}
function tick() {
  if (!playing) return;
  const t = vid.currentTime;
  const ff = C.ff.some(([a, b]) => t >= a && t < b);
  $('badge').classList.toggle('on', ff);
  if (t >= target - 0.5 / C.fps || vid.ended) return arrive();
  raf = requestAnimationFrame(tick);
}
function arrive() {
  stopPlay(); const s = stopOf(states[cur].i); vid.pause(); snap(s.t);
  setZoom(s.rect, s.phone); $('pausechip').hidden = false;
  if (autoOn) scheduleAuto();
  focusNext();
}
function stopPlay() { playing = false; cancelAnimationFrame(raf); $('badge').classList.remove('on'); $('skip').hidden = true; clearTimeout(autoT); }
function focusNext() { if (document.activeElement === document.body || document.activeElement?.id === 'skip') $('next').focus({preventScroll: true}); }

// auto-play
let autoOn = false, autoT = 0;
function scheduleAuto() { clearTimeout(autoT); if (!autoOn) return; const st = states[cur];
  const wait = st.k === 'stop' ? 4000 + stopOf(st.i).cap.length * 35 : 4500;
  if (cur < states.length - 1) autoT = setTimeout(next, RM ? wait + 1000 : wait); }

// ---------- hash deep links: #start, #s3, #s3-2, #end
function setHash() { const st = states[cur]; let h = 'start';
  if (st.k === 'topic') h = 's' + (st.s + 1); else if (st.k === 'stop') h = `s${st.s + 1}-${S[st.s].stops.indexOf(st.i) + 1}`; else if (st.k === 'end') h = 'end';
  if (location.hash.slice(1) !== h) history.replaceState(null, '', '#' + h); }
function buildPrint() {
  const el = $('print'); if (el.dataset.done) return; el.dataset.done = '1';
  let h = `<p class="noprint"><a class="ghost back2" href="#start">Back to the demo</a> Use your browser's Print command to save this as a PDF.</p><section><h2>${esc(C.title.title)}</h2><p>${esc(C.title.lede)}</p><p>${S.map((s, k) => `${k + 1}. ${esc(s.topic)}`).join(' · ')}</p></section>`;
  S.forEach((sec, si) => { h += `<section><p class="pk">Section ${si + 1} of ${N} · ${esc(chapterOf(si))}</p><h2>${esc(sec.topic)}</h2><p>${esc(sec.desc)}</p><p class="pn"><b>Key message:</b> ${esc(sec.notes[0])} <b>Likely question:</b> ${esc(sec.notes[1])}</p><div class="pg">${sec.stops.map((i, n) => `<figure><img src="thumbs/${String(i + 1).padStart(2, '0')}.jpg" alt=""><figcaption><b>${si + 1}.${n + 1}</b> ${esc(ST[i].cap)}</figcaption></figure>`).join('')}</div></section>`; });
  h += `<section><h2>${esc(C.end.title)}</h2><ul>${C.end.points.map(p => `<li>${esc(p)}</li>`).join('')}</ul></section>`;
  el.innerHTML = h;
}
function setPrintMode(on) { document.documentElement.classList.toggle('printmode', on); if (on) buildPrint(); }
function fromHash() { const h = location.hash.slice(1); let i = 0; setPrintMode(h === 'print'); if (h === 'print') return cur;
  const m = /^s(\d+)(?:-(\d+))?$/.exec(h);
  if (h === 'end') i = states.length - 1;
  else if (m) { const si = +m[1] - 1; if (si >= 0 && si < N) { i = states.findIndex(x => x.k === 'topic' && x.s === si);
    if (m[2]) { const j = S[si].stops[+m[2] - 1]; if (j !== undefined) i = states.findIndex(x => x.k === 'stop' && x.i === j); } } }
  return i; }

// ---------- rail
function buildRail() {
  const home = '<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 9.5 10 3.5l7 6V17h-4.5v-4.5h-5V17H3z" fill="currentColor"/></svg>';
  const flag = '<svg class="icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M5 17V3.5M5 4h10l-2.5 3.5L15 11H5" stroke="currentColor" stroke-width="2" fill="none" stroke-linejoin="round"/></svg>';
  let h = `<button type="button" id="railhome" aria-label="Title">${home}</button>`;
  C.chapters.forEach(ch => { h += `<span class="chap">${esc(ch.name)}</span>`;
    ch.secs.forEach(si => { h += `<button type="button" data-s="${si}" aria-label="Section ${si + 1}: ${esc(S[si].topic)}"><span class="n">${si + 1}</span><span class="t">${esc(shortT(S[si].topic))}</span></button>`; }); });
  h += `<button type="button" id="railend" aria-label="Recap">${flag}</button>`;
  $('rail').innerHTML = h;
}
function shortT(t) { return t.length > 26 ? t.split(' ').slice(0, 3).join(' ') + '…' : t; }

// ---------- notes (in-page panel)
function syncNotes() {
  const p = $('notes'); if (p.hidden) return; const st = states[cur];
  let h = '<button class="ghost x" type="button" id="notesx">Close</button>';
  if (st.s !== undefined) { const sec = S[st.s];
    h += `<h3>${secLabel(st.s)} · ${esc(sec.topic)}</h3><p><b>Key message:</b> ${esc(sec.notes[0])}</p><p><b>Likely question:</b> ${esc(sec.notes[1])}</p>`;
    if (st.k === 'stop') h += `<p><b>On screen now:</b> ${esc(stopOf(st.i).cap)}</p>`;
    const nx = states[cur + 1]; if (nx) h += `<p><b>Say next:</b> ${esc(nx.k === 'topic' ? 'Next up, ' + S[nx.s].topic.toLowerCase() + '.' : nx.k === 'end' ? 'Let us recap.' : stopOf(nx.i).cap)}</p>`;
  } else if (st.k === 'title') h += `<h3>Opening</h3><p>One GreenGrid deal, from the first email to verified Salesforce updates, across Outlook, Teams and mobile. The last two sections show a second deal.</p><p><b>Say next:</b> We start with a customer email in Outlook.</p>`;
  else h += `<h3>Close</h3><p>Every change Copilot made to Salesforce was shown and confirmed first, then verified.</p><p><b>Next step to suggest:</b> run the same flow on your own Salesforce sandbox.</p>`;
  p.innerHTML = h; $('notesx').onclick = toggleNotes;
}
function toggleNotes() { const p = $('notes'); p.hidden = !p.hidden; $('notesbtn').setAttribute('aria-expanded', String(!p.hidden)); if (!p.hidden) syncNotes(); else $('notesbtn').focus(); }

// ---------- guide tips (one rule table)
const TIPS = [
  ['#next', 'Continue', 'Plays the recording to the next step and pauses there. Space, Enter or the right arrow do the same.'],
  ['#back', 'Back', 'Returns to the previous step or card without playing. Left arrow does the same.'],
  ['#skip', 'Skip ahead', 'Jumps straight to the next pause point if you do not want to wait for the recording.'],
  ['#restart', 'Restart', 'Goes back to the title card.'],
  ['#printlink', 'Print view', 'Opens a printable script: each section with its topic, description and a picture of every step. Use the browser\'s Print to save a PDF.'],
  ['#notesbtn', 'Presenter notes', 'Opens the key message, the likely customer question and what to say next. Shortcut: N.'],
  ['#autolbl', 'Auto-play', 'Moves through the steps on its own, pausing long enough to read each caption. Shortcut: P.'],
  ['#tipslbl', 'Guide tips', 'Turns these hover explanations on or off. Switch them off before a customer session.'],
  ['#railhome', 'Title', 'Back to the opening card.'],
  ['#railend', 'Recap', 'Jumps to the recap card at the end.'],
  ['[data-s]', el => `Section ${+el.dataset.s + 1}`, el => `Opens the topic card for “${S[+el.dataset.s].topic}”.`],
  ['.chap', 'Chapter', 'Sections are grouped into four chapters. Click a numbered section to jump.'],
  ['.cap', 'Step caption', 'What is on screen at this pause, in one sentence. Screen readers announce it.'],
  ['.where', 'Position', 'Section and step number, for example 3.2 is the second step of section 3.'],
  ['#spot', 'Highlight', 'The highlighted area is what this step is about.'],
  ['#stage', 'Recording', 'The real demo recording. It plays between steps and pauses on each result.'],
  ['[data-act="start"]', 'Start', 'Begins the walkthrough with the first section card.'],
  ['[data-act="next"]', 'Show me', 'Plays the first part of this section and stops on its first result.'],
  ['[data-act="replay"]', 'Replay', 'Starts again from the title card.'],
  ['[data-act="last"]', 'Back to the last step', 'Returns to the final step of the last section.'],
  ['[data-go]', 'Revisit a section', 'Jumps to that section\'s topic card.'],
  ['.chips li', 'Topic tag', 'What this section touches, at a glance.'],
  ['.card h1', 'Demo title', 'What this walkthrough shows, end to end.'],
  ['.card h2', el => states[cur].k === 'end' ? 'Recap' : 'Section topic', el => states[cur].k === 'end' ? 'The four things to remember from this demo.' : 'The topic of the section that follows. Read the short description under it, then click Show me.'],
  ['#notes h3', 'Notes heading', 'Which section these notes belong to.'],
  ['.peek', 'Preview', 'A still from the recording: where this section ends up. Click Show me to play it.'],
  ['.secnum', 'Section number', 'Position in the walkthrough and the chapter this section belongs to.'],
  ['#notes', 'Presenter notes', 'Only you see these while presenting. Press N or Close to hide them.'],
  ['#notesx', 'Close notes', 'Hides the presenter notes. Esc or N does the same.'],
];
let tipsOn = true, tipT = 0, tipEl = null, suppress = false, kbd = false;
document.addEventListener('pointerdown', () => { kbd = false; suppress = true; hideTip(); }, true);
function ruleFor(el) { for (let e = el; e && e !== document.body; e = e.parentElement) for (const [sel, t, d] of TIPS) if (e.matches && e.matches(sel)) return {e, t: typeof t === 'function' ? t(e) : t, d: typeof d === 'function' ? d(e) : d}; return null; }
function showTip(r) { const tip = $('tip'); tip.innerHTML = `<b>${esc(r.t)}</b>${esc(r.d)}`; tip.hidden = false;
  const b = r.e.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight;
  let x = Math.min(innerWidth - tw - 8, Math.max(8, b.left + b.width / 2 - tw / 2)), y = b.top - th - 10;
  if (y < 8) y = Math.min(innerHeight - th - 8, b.bottom + 10);
  tip.style.left = x + 'px'; tip.style.top = y + 'px'; tipEl = r.e; }
window.__rule = e => { for (const [sel] of TIPS) if (e.matches && e.matches(sel)) return true; return false; };
function hideTip() { clearTimeout(tipT); $('tip').hidden = true; tipEl = null; }
document.addEventListener('pointerover', e => { if (!tipsOn || suppress || e.pointerType === 'touch') return; if ($('tip').contains(e.target)) { clearTimeout(tipT); return; }
  const r = ruleFor(e.target); clearTimeout(tipT); if (!r) { tipT = setTimeout(hideTip, 150); return; } if (r.e === tipEl) return; tipT = setTimeout(() => showTip(r), 500); });
document.addEventListener('pointermove', () => { suppress = false; }, {passive: true});
document.addEventListener('focusin', e => { if (!tipsOn || !kbd) return; const r = ruleFor(e.target); if (r) showTip(r); else hideTip(); });
document.addEventListener('scroll', hideTip, true);
$('tips').addEventListener('change', e => { tipsOn = e.target.checked; hideTip(); e.target.blur(); });

// ---------- events
$('next').onclick = next; $('back').onclick = back; $('restart').onclick = () => go(0);
$('skip').onclick = () => { if (playing) { vid.currentTime = target; arrive(); } };
$('notesbtn').onclick = toggleNotes;
$('auto').addEventListener('change', e => { autoOn = e.target.checked; e.target.blur(); if (autoOn && !playing) scheduleAuto(); else clearTimeout(autoT); });
card.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  const a = b.dataset.act; if (a === 'start' || a === 'next') next(); else if (a === 'replay') go(0); else if (a === 'last') go(states.length - 2);
  else if (b.dataset.go) go(states.findIndex(x => x.k === 'topic' && x.s === +b.dataset.go)); });
$('rail').addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'railhome') go(0); else if (b.id === 'railend') go(states.length - 1);
  else go(states.findIndex(x => x.k === 'topic' && x.s === +b.dataset.s)); });
document.addEventListener('keydown', e => {
  if (e.key === 'Tab') { kbd = true; return; }
  suppress = true; kbd = false; hideTip();
  if (e.key === 'Escape') { if (!$('tip').hidden) { hideTip(); return; } if (!$('notes').hidden) toggleNotes(); return; }
  const t = e.target; if (t && (t.tagName === 'INPUT' && t.type !== 'checkbox')) return;
  const onBtn = t && t.tagName === 'BUTTON' && t !== $('next');
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || ((e.key === ' ' || e.key === 'Enter') && !onBtn)) { e.preventDefault(); if (playing) $('skip').click(); else next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); back(); }
  else if (e.key === 'n' || e.key === 'N') toggleNotes();
  else if (e.key === 'p' || e.key === 'P') { $('auto').checked = !$('auto').checked; $('auto').dispatchEvent(new Event('change')); }
});
addEventListener('resize', () => { const st = states[cur]; if (st.k === 'stop' && !playing) { const s = stopOf(st.i); zoom.style.transition = spot.style.transition = 'none'; setZoom(s.rect, s.phone); requestAnimationFrame(() => { zoom.style.transition = spot.style.transition = ''; }); } });
addEventListener('hashchange', () => { const i = fromHash(); if (location.hash !== '#print' && i !== cur) go(i); });

setTimeout(() => { $('rotate').hidden = true; }, 7000); $('rotate').onclick = () => { $('rotate').hidden = true; };
buildRail();
cur = fromHash();
render();
load();
}
</script>
