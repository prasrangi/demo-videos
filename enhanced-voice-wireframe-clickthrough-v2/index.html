<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SE1 Enhanced Voice wireframe</title>
<meta name="description" content="Click-through wireframe of the proposed SE1 Enhanced Voice production architecture. Illustrative, not a validated build.">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Carlito:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root { --ink:#0E2433; --teal:#0A6570; --teal2:#0E7C86; --paper:#F6F3EE; --card:#FFFCF8; --line:#D4CFC6; --tint:#D4EBED; --mute:#3E4C57; --amber:#7A4E00; --amberbg:#FFF1D6; --amberline:#B7791F; }
html, body { margin: 0; height: 100%; }
body { background: var(--ink); color: var(--ink); font-family: 'Carlito', Calibri, Arial, sans-serif; }
body[data-view="start"], body[data-view="print"], body[data-view="notes"] { height: auto; min-height: 100%; background-color: var(--paper); background-image: radial-gradient(circle, #DCD6CB 1px, transparent 1px); background-size: 24px 24px; }
body[data-view="board"] { overflow: hidden; }
#stage { position: fixed; left: 0; top: 0; right: 0; bottom: 0; overflow: hidden; display: none; }
body[data-view="board"] #stage { display: block; }
#board { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
#view { display: none; }
body:not([data-view="board"]) #view { display: block; }
a:focus-visible, button:focus-visible { outline: 3px solid var(--teal2); outline-offset: 2px; }
.mono, .eyebrow, .role, .cmeta, .ev, .chip, .keys, .meta { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; }

#hint { display: none; position: fixed; left: 0; right: 0; top: 0; z-index: 5; padding: 10px 16px; background: var(--amberbg); color: var(--amber); font-size: 15px; text-align: center; border-bottom: 1.5px solid var(--amberline); }
body.portrait-small[data-view="board"] #hint { display: block; }

/* evidence labels (shared with the boards) */
.ev { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border: 1.5px solid; border-radius: 4px; font-weight: 500; font-size: 12px; line-height: 16px; letter-spacing: .02em; }
.ev.doc { background: var(--tint); border-color: var(--teal); color: var(--teal); }
.ev.cfg { background: #fff; border-color: var(--ink); color: var(--ink); }
.ev.val { background: var(--amberbg); border: 1.5px dashed var(--amberline); color: var(--amber); }
.ev.oos { background: #fff; border: 1.5px dashed #6B7A84; color: #4A545C; text-decoration: line-through; }

/* start screen */
.st { max-width: 1120px; margin: 0 auto; padding: 56px 32px 48px; }
.st .eyebrow { margin: 0 0 8px; font-weight: 500; font-size: 12px; letter-spacing: .1em; color: var(--teal); }
.st h1 { margin: 0; font-size: 56px; line-height: 62px; font-weight: 700; }
.st .prep { margin: 10px 0 0; font-size: 22px; font-weight: 700; color: var(--teal); }
.st .lede { margin: 16px 0 18px; max-width: 720px; font-size: 21px; line-height: 30px; color: var(--ink); }
.st .chip { display: inline-block; margin: 0; padding: 6px 12px; border: 1.5px dashed var(--amberline); border-radius: 6px; background: var(--amberbg); color: var(--amber); font-weight: 500; font-size: 12px; letter-spacing: .04em; }
.st h2 { margin: 40px 0 14px; font-size: 14px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }
.cards { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.card { display: flex; flex-direction: column; gap: 10px; min-height: 200px; padding: 22px; background: var(--card); border: 1.5px solid var(--ink); border-radius: 10px; color: var(--ink); text-decoration: none; transition: background .2s, box-shadow .2s; }
.card:hover { background: #fff; box-shadow: 6px 6px 0 rgba(14,36,51,.10); }
.card.primary { background: var(--ink); color: #fff; }
.card.primary:hover { background: #17384d; }
.role { font-weight: 500; font-size: 12px; letter-spacing: .08em; color: var(--teal); }
.card.primary .role { color: #8FD3DA; }
.ctitle { font-size: 26px; line-height: 30px; font-weight: 700; }
.ctext { flex: 1 1 auto; font-size: 17px; line-height: 24px; }
.cmeta { font-size: 12px; letter-spacing: .04em; color: var(--mute); }
.card.primary .cmeta { color: #D4EBED; }
.legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.legend li { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.legend .ev { flex: none; min-width: 172px; }
.legend .lg { font-size: 17px; line-height: 24px; }
.st .meta { margin: 32px 0 6px; font-size: 12px; line-height: 18px; color: var(--mute); }
.st .keys { margin: 0; font-size: 12px; line-height: 18px; color: var(--mute); }
.st .keys a { color: var(--teal); font-weight: 500; }

/* presenter notes window and inline panel */
.nv { padding: 22px 26px 30px; max-width: 700px; font-size: 18px; line-height: 26px; }
.nv p { margin: 4px 0 10px; }
.nv h2 { margin: 12px 0 4px; font-size: 26px; line-height: 30px; }
.nv h3 { margin: 16px 0 2px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); }
.nv-top { display: flex; justify-content: space-between; margin-bottom: 10px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--mute); }
.nv-evl, .nv-cap { color: var(--mute); font-size: 16px; line-height: 22px; }
.nv-q { font-weight: 700; }
.nv-btns { display: flex; gap: 10px; margin-top: 20px; }
.nv-btns button, .nv-close, .pbar button { height: 48px; padding: 0 20px; border: 1.5px solid var(--ink); border-radius: 8px; background: var(--card); color: var(--ink); font: 700 16px 'Carlito', Calibri, Arial, sans-serif; cursor: pointer; }
.nv-btns .go, .pbar .go { background: var(--teal); border-color: var(--teal); color: #fff; }
.nv-close { margin-top: 12px; height: 40px; }
.nv-empty { color: var(--mute); }
#notes-inline { display: none; position: fixed; right: 16px; bottom: 16px; z-index: 10; width: 440px; max-height: 72vh; overflow: auto; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 10px; box-shadow: 6px 6px 0 rgba(14,36,51,.18); }
body.notes-inline #notes-inline { display: block; }

/* print view */
.pbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 16px 24px; font-size: 16px; color: var(--mute); }
.pbar a { color: var(--teal); font-weight: 700; }
.pp { margin: 0 auto 24px; width: fit-content; background: #fff; box-shadow: 0 2px 12px rgba(14,36,51,.18); }
.pw { overflow: hidden; }
.pi { width: 1440px; transform: scale(.69); transform-origin: 0 0; }

@media (max-width: 860px) {
  .cards { grid-template-columns: minmax(0, 1fr); }
  .st { padding: 32px 20px 40px; }
  .st h1 { font-size: 40px; line-height: 46px; }
}
@media print {
  @page { size: landscape; margin: 8mm; }
  html, body { height: auto !important; background: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .pbar { display: none !important; }
  .pp { margin: 0; box-shadow: none; break-after: page; page-break-after: always; }
  .pp:last-child { break-after: auto; page-break-after: auto; }
}
@media (prefers-reduced-motion: reduce) {
  .card { transition: none; }
}
</style>
</head>

<!-- Board sources: markup, styles and logic for each board. Edit these to change the demo. -->
<script type="text/plain" id="b-main-css">
:host { --ink:#0E2433; --teal:#0A6570; --teal2:#0E7C86; --paper:#F6F3EE; --card:#FFFCF8; --line:#D4CFC6; --tint:#D4EBED; --tint2:#E6EEF0; --mute:#3E4C57; --sand:#EFE4D4; --sandline:#C4B59A; --amber:#7A4E00; --amberbg:#FFF1D6; --amberline:#B7791F; }
body { margin: 0; }
.ui { font-family: 'Carlito', Calibri, Arial, sans-serif; color: var(--ink); }
.ui * { box-sizing: border-box; }
.grid { background-color: #F6F3EE; background-image: radial-gradient(circle, #DCD6CB 1px, transparent 1px); background-size: 24px 24px; }
button { font-family: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--teal2); outline-offset: 2px; }

.eyebrow { position: absolute; left: 64px; top: 64px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; font-size: 12px; letter-spacing: .1em; line-height: 16px; color: var(--teal); }
.h1 { position: absolute; left: 64px; top: 84px; margin: 0; font-size: 36px; line-height: 42px; font-weight: 700; }
.chip { position: absolute; height: 30px; display: flex; align-items: center; padding: 0 12px; border: 1.5px dashed var(--amberline); border-radius: 6px; background: var(--amberbg); color: var(--amber); font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; font-size: 12px; letter-spacing: .04em; }
.tabs { position: absolute; right: 64px; top: 70px; display: flex; gap: 8px; }
.tab { height: 44px; padding: 0 18px; display: flex; align-items: center; border: 1.5px solid var(--ink); border-radius: 8px; background: var(--card); color: var(--ink); font-weight: 700; font-size: 15px; text-decoration: none; }
a.tab:hover { background: var(--tint); }
.tab.cur { background: var(--ink); color: #fff; }
.banner { position: absolute; left: 64px; top: 136px; width: 1312px; height: 64px; background: var(--ink); border-radius: 10px; display: flex; align-items: center; gap: 24px; padding: 0 24px; color: #fff; }
.banner .lab { flex: none; width: 128px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; font-size: 12px; letter-spacing: .1em; color: #8FD3DA; }
.banner .t1 { font-weight: 700; font-size: 17px; line-height: 22px; }
.banner .t2 { font-size: 14px; line-height: 18px; color: #D4EBED; }

.band { position: absolute; background: var(--tint2); border: 1px dashed #AFC6CB; border-radius: 12px; }
.blabel { position: absolute; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); line-height: 16px; }
.nd { position: absolute; display: flex; align-items: center; justify-content: center; text-align: center; background: var(--card); border: 1.5px solid #B9B3A6; border-radius: 8px; color: var(--ink); font-size: 14px; line-height: 20px; transition: background .4s, border-color .4s, box-shadow .4s; }
.nd.done { background: var(--tint); border-color: #6FA3AA; }
.nd.on { background: var(--tint); border-color: var(--teal); box-shadow: 0 0 0 3px rgba(10,101,112,.20); animation: glow 1.8s ease-in-out infinite; }
.nd.dark { background: var(--ink); border-color: var(--ink); color: #fff; }
.nd.dark.on { background: var(--ink); border-color: var(--teal2); box-shadow: 0 0 0 3px rgba(14,124,134,.45); animation: glowd 1.8s ease-in-out infinite; }
.nd.frame, .nd.frame.done, .nd.frame.on { background: #fff; }
.nd.opt { background: var(--sand); border: 1.5px dashed var(--sandline); font-size: 14px; }
.nd.opt.on { background: var(--sand); border-color: var(--teal); }
.cap { padding: 1px 7px; border-radius: 999px; transition: background .3s, color .3s; }
.cap.on { background: var(--teal2); color: #fff; }
.ghost { position: absolute; top: 788px; height: 28px; display: flex; align-items: center; justify-content: center; border: 1.5px dashed #9A9488; border-radius: 6px; font-size: 14px; color: #5A5F63; text-decoration: line-through; }
.gate { position: absolute; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1.5px solid var(--ink); border-radius: 999px; background: var(--card); font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; font-size: 12px; color: var(--ink); transition: background .3s, border-color .3s, color .3s; }
.gate .dt { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--ink); }
.gate.wait { background: var(--amberbg); border-color: var(--amberline); color: var(--amber); animation: glowa 1.4s ease-in-out infinite; }
.gate.wait .dt { background: var(--amber); }
.gate.open { background: var(--tint); border-color: var(--teal); color: var(--teal); }
.gate.open .dt { background: var(--teal); }

.pkt { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--teal2); box-shadow: 0 0 0 3px rgba(14,124,134,.25); opacity: 0; animation-duration: 3.6s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-fill-mode: both; }
.pk-a1 { left: 771px; top: 307px; animation-name: mvx72; animation-duration: 1.6s; }
.pk-a2 { left: 1211px; top: 357px; animation-name: mvy52; }
.pk-a3 { left: 715px; top: 577px; animation-name: mvy46; }
.pk-a4 { left: 893px; top: 663px; animation-name: mvx50; }
.pk-a2r { left: 1211px; top: 409px; animation-name: mvyn52; }
.pk-a3r { left: 715px; top: 623px; animation-name: mvyn46; }
.pk-a4r { left: 943px; top: 663px; animation-name: mvxn50; }
.dl0 { animation-delay: 0s; }
.dl1 { animation-delay: .5s; }
.dl2 { animation-delay: 1s; }
.dl3 { animation-delay: 1.8s; }
.dl4 { animation-delay: 2.3s; }
.dl5 { animation-delay: 2.8s; }

.ph { position: absolute; left: 64px; top: 220px; width: 360px; height: 600px; border: 2px solid var(--ink); border-radius: 36px; background: var(--card); overflow: hidden; display: flex; flex-direction: column; box-shadow: 6px 6px 0 rgba(14,36,51,.10); }
.ph-bar { flex: none; height: 64px; display: flex; align-items: center; gap: 10px; padding: 0 18px 0 14px; border-bottom: 1.5px solid var(--line); background: #fff; }
.avatar { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1.5px dashed #6B7A84; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; font-size: 14px; color: var(--mute); }
.ph-title { font-weight: 700; font-size: 17px; line-height: 20px; }
.ph-sub { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; line-height: 14px; color: var(--teal); }
.ph-chat { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; padding: 10px 14px 12px; -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 40px); mask-image: linear-gradient(to bottom, transparent 0, #000 40px); }
.msg { flex: none; }
.bub { max-width: 292px; padding: 10px 12px; font-size: 14px; line-height: 19px; }
.bub.agent { align-self: flex-start; background: #fff; border: 1.5px solid var(--line); border-radius: 14px 14px 14px 4px; }
.bub.user { align-self: flex-end; background: var(--ink); color: #fff; border-radius: 14px 14px 4px 14px; }
.cap-note { align-self: flex-end; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; line-height: 14px; color: var(--mute); }
.pcard { align-self: stretch; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.pcard-h { padding: 8px 12px 6px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; font-size: 12px; letter-spacing: .08em; line-height: 14px; color: var(--teal); }
.prow { display: flex; align-items: center; gap: 10px; min-height: 34px; padding: 6px 12px; border-top: 1px solid #E7E2D8; font-size: 14px; line-height: 18px; }
.prow .k { flex: none; width: 92px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; letter-spacing: .04em; color: var(--mute); }
.prow .v { flex: 1 1 auto; min-width: 0; white-space: pre-line; }
.prow .sub { display: block; font-size: 13px; line-height: 16px; color: var(--mute); }
.prow .sub.warn { color: var(--amber); font-weight: 700; }
.srch { max-height: 40px; overflow: hidden; color: var(--mute); animation: collapse .4s ease 1.5s both; }
.ic { position: relative; flex: none; width: 18px; height: 18px; }
.ic .ring { position: absolute; left: 0; top: 0; display: block; width: 18px; height: 18px; border: 2px solid #6B7A84; border-radius: 50%; }
.ic .box { position: absolute; left: 0; top: 0; display: block; width: 18px; height: 18px; border: 2px solid #6B7A84; border-radius: 4px; }
.ic .spin { position: absolute; left: 0; top: 0; display: block; width: 18px; height: 18px; border: 2px solid #BFD9DD; border-top-color: var(--teal); border-radius: 50%; animation: spin .8s linear infinite; }
.ic svg { position: absolute; left: 0; top: 0; }
.tk { animation: pop .35s both; }
.pfoot { display: flex; align-items: center; gap: 8px; padding: 8px 12px 12px; border-top: 1px solid #E7E2D8; }
.pnote { padding: 8px 12px 10px; border-top: 1px solid #E7E2D8; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; line-height: 15px; color: var(--mute); }
.pbtn { height: 44px; min-width: 44px; padding: 0 16px; border-radius: 8px; border: 1.5px solid var(--ink); background: #fff; color: var(--ink); font-weight: 700; font-size: 15px; cursor: pointer; position: relative; overflow: hidden; }
.pbtn.pri { flex: 1 1 auto; background: var(--teal); border-color: var(--teal); color: #fff; }
.pbtn.cue { animation: cue 1.4s ease-out infinite; }
.mic.cue { animation: ring 1.6s ease-out infinite; }
.ph-comp { flex: none; height: 76px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-top: 1.5px solid var(--line); background: #fff; }
.field { flex: 1 1 auto; min-width: 0; height: 44px; border: 1.5px solid var(--line); border-radius: 22px; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-size: 14px; color: var(--mute); overflow: hidden; background: var(--card); }
.wave { display: flex; align-items: center; gap: 3px; height: 24px; }
.bar { display: block; width: 3px; height: 24px; border-radius: 2px; background: var(--teal); animation: wave 1s ease-in-out infinite; }
.mic { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; }
.mic.rec { background: var(--teal); animation: ring 1.2s ease-out infinite; }
.rise { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }
.w { animation: wordin .35s both; }

.capbar { position: absolute; left: 64px; top: 836px; width: 1312px; height: 76px; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; display: flex; align-items: center; gap: 20px; padding: 0 20px; }
.capbar .stp-old { flex: none; width: 118px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; font-size: 12px; letter-spacing: .08em; color: var(--teal); }
.capbar .tx { flex: 1 1 auto; min-width: 0; }
.capbar .s1 { font-weight: 700; font-size: 18px; line-height: 22px; }
.capbar .s2 { font-size: 14px; line-height: 18px; color: var(--mute); }
.ctrls { position: absolute; left: 64px; top: 924px; display: flex; align-items: center; gap: 8px; }
.cbtn { height: 44px; min-width: 44px; padding: 0 16px; border: 1.5px solid var(--ink); border-radius: 8px; background: var(--card); color: var(--ink); font-weight: 700; font-size: 15px; cursor: pointer; }
.cbtn:hover { background: var(--tint); }
.cbtn.pri { background: var(--ink); color: #fff; }
.cbtn.pri:hover { background: var(--teal); }
.cbtn.big { height: 52px; padding: 0 18px; font-size: 16px; }
.cbtn.go { background: var(--teal); border-color: var(--teal); color: #fff; }
.cbtn.go:hover { background: var(--ink); }
.cbtn:disabled { opacity: .4; cursor: default; }
.cbtn:disabled:hover { background: var(--card); }
a.cbtn { display: flex; align-items: center; text-decoration: none; }
.trk { position: absolute; left: 470px; top: 949px; width: 836px; height: 3px; background: var(--line); border-radius: 2px; }
.trk-f { position: absolute; left: 470px; top: 949px; height: 3px; background: var(--teal); border-radius: 2px; transition: width .5s ease; }
.steps { position: absolute; left: 400px; top: 928px; width: 976px; display: flex; }
.stp-b { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0; border: 0; background: transparent; cursor: pointer; color: var(--ink); }
.sn { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--card); border: 1.5px solid #6B7A84; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; font-size: 15px; transition: background .3s, color .3s, border-color .3s; }
.sn.vis { background: var(--tint); border-color: var(--teal); color: var(--teal); }
.sn.cur { background: var(--teal); border-color: var(--teal); color: #fff; box-shadow: 0 0 0 5px rgba(10,101,112,.2); }
.stp-b:hover .sn { border-color: var(--teal); }
.sl { font-size: 14px; line-height: 16px; text-align: center; max-width: 128px; color: var(--mute); }
.stp-b.cur .sl { color: var(--ink); font-weight: 700; }

<script type="text/plain" id="b-main-js">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 1, playing: false, fail: false, pick: 0 };
  }
  componentDidMount() { this._alive = true; this.demoSchedule(); }
  componentWillUnmount() { this._alive = false; clearTimeout(this._t); }
  demoSchedule() {
    clearTimeout(this._t);
    if (!this._alive || !this.state.playing) return;
    var DUR = [3600, 5400, 4600, 7000, 5400, 5200, 6200];
    var d = DUR[this.state.step - 1] || 4500;
    this._t = setTimeout(() => {
      if (!this._alive) return;
      var nxt = this.state.step >= 7 ? 1 : this.state.step + 1;
      this.demoGo(nxt, false);
    }, d);
  }
  demoGo(n, pause) {
    var up = { step: n };
    if (pause) up.playing = false;
    if (n <= 3) up.pick = 0;
    this.setState(up);
    this.demoSchedule();
  }
  demoSteps() {
    return [
      { label: 'Open Sales agent', ev: 'doc',
        text: 'After the meeting, open Sales agent on mobile or Outlook.',
        hood: 'Sellers stay in Sales agent. They never open the declarative agent.',
        notes: { say: 'Sellers stay in the tool they already use.', link: 'Imagine a seller has just left a customer meeting.', q: 'Do sellers need a new app?', a: 'No. Sales agent is already in Outlook and the Microsoft 365 Copilot app. The declarative agent works behind the scenes.' } },
      { label: 'Dictate the summary', ev: 'doc',
        text: 'You dictate your meeting summary, in your own words.',
        hood: 'Voice input on mobile is already in Sales agent.',
        notes: { say: 'One spoken summary, no forms.', link: 'They just talk, the way they would to a colleague.', q: 'Is voice input new?', a: 'No. Microsoft documents voice input in Sales agent on iOS and Android, through the mic in the Microsoft 365 Copilot app or keyboard dictation in Outlook mobile.' } },
      { label: 'Extract the outcome', ev: 'val',
        text: 'Sales agent picks out the account, contact, opportunity and follow-ups.',
        hood: "It uses Sales agent's existing AI. No Azure OpenAI is added.",
        notes: { say: 'One summary becomes several structured outcomes.', link: 'Now it works out what happened in the meeting.', q: 'Does this work with Salesforce today?', a: "Microsoft's published voice update of opportunity fields covers Dynamics 365 Sales, in public preview since April 2026. Multi-entity extraction on Salesforce is on our validation list." } },
      { label: 'Retrieve Salesforce records', ev: 'cfg',
        text: 'Sales agent finds the matching Salesforce records and prepares the updates.',
        hood: 'Copied MCP/API tools find the records. If several match, it asks which one.',
        notes: { say: 'Existing tools find the right records, and the seller settles any doubt.', link: 'Next it checks Salesforce. Tap one of the two matches to answer.', q: 'What if two records match?', a: 'Sales agent asks which one before anything is saved. Microsoft documents clarifying questions when several opportunities match.' } },
      { label: 'Review and confirm', ev: 'val',
        text: 'You review and confirm.',
        hood: 'Records, actions and dates are shown first. Nothing is written until you confirm.',
        notes: { say: 'Nothing is written until the seller confirms.', link: 'This is the control point.', q: 'Can sellers edit before saving?', a: 'Yes. They review the records, actions and dates and correct them. Microsoft states confirmation is required before any CRM update is saved. One approval for several records is on the validation list.' } },
      { label: 'Write to Salesforce', ev: 'cfg',
        text: 'Sales agent writes the activity, fields and tasks to Salesforce.',
        hood: 'Simple writes need no middleware. Complex multi-record rules use Salesforce Flow or Apex, not Azure Functions.',
        notes: { say: 'Writes run as the seller, with their Salesforce permissions.', link: 'Once confirmed, the tools write.', q: 'Do we need Azure Functions or API Management?', a: 'Not in the baseline. Simple writes use the Salesforce MCP/API directly. Salesforce hosted MCP runs as the signed-in user and respects field-level security and sharing rules.' } },
      { label: 'Confirm what was written', ev: 'val',
        text: 'Sales agent confirms what was written and flags anything that failed.',
        hood: 'Tools return results, so the agent can say what was created, updated or failed.',
        notes: { say: 'The seller sees what worked and what did not.', link: 'Finally the agent reports back. Use the button to simulate a failure.', q: 'What happens when a write fails?', a: 'The agent flags what was not written and the seller can retry. Retry and partial-failure behaviour is on the validation list.' } }
    ];
  }
  meta() {
    var s = this.state.step, x = this.demoSteps()[s - 1];
    return { board: 'Seller flow', step: s, total: 7, label: x.label, caption: x.text, ev: x.ev, notes: x.notes };
  }
  renderVals() {
    var self = this;
    var s = this.state.step;
    var fail = this.state.fail;
    var EV = window.DEMO_EV;
    var CUST = window.DEMO_CUSTOMER || 'Sample Company';
    var TEAL = '#0A6570', MID = '#5F9097', GREY = '#8a8378';
    var on = function (l) { return l.indexOf(s) >= 0; };
    var past = function (l) { for (var i = 0; i < l.length; i++) { if (l[i] < s) return true; } return false; };
    var nd = function (base, l) { return base + (on(l) ? ' on' : (past(l) ? ' done' : '')); };
    var ln = function (l) { return on(l) ? TEAL : (past(l) ? MID : GREY); };
    var W = [4, 6, 7];
    var STEPS = this.demoSteps();
    var cur = STEPS[s - 1];
    var ev = EV[cur.ev];

    var capKey = { 1: 'conv', 2: 'conv', 3: 'ext', 4: 'rec', 5: 'conf', 7: 'conf' }[s];
    var cap = function (k) { return 'cap' + (capKey === k ? ' on' : ''); };

    var utter = 'I met Alex from ' + CUST + '. We discussed the upcoming implementation. The customer requested a demonstration next week, and I need to send the proposal by Friday.';
    var words = utter.split(' ').map(function (t, i) {
      return { t: t + ' ', d: (s === 2 ? (0.4 + i * 0.13) : 0).toFixed(2) + 's' };
    });
    var extractRows = [
      { k: 'ACCOUNT', v: CUST },
      { k: 'CONTACT', v: 'Alex' },
      { k: 'OPPORTUNITY', v: 'Upcoming implementation' },
      { k: 'OUTCOME', v: 'Demonstration requested' },
      { k: 'FOLLOW-UPS', v: 'Demonstration, next week\nSend proposal, by Friday' }
    ].map(function (r, i) { return { k: r.k, v: r.v, d: (s === 3 ? (0.3 + i * 0.3) : 0).toFixed(2) + 's' }; });
    var matchRows = [
      { k: 'ACCOUNT', v: CUST },
      { k: 'CONTACT', v: 'Alex' }
    ].map(function (r, i) { return { k: r.k, v: r.v, d: (s === 4 ? (2.0 + i * 0.3) : 0).toFixed(2) + 's' }; });
    var OPPS = ['Upcoming implementation, Phase 1', 'Upcoming implementation, Phase 2'];
    var picked = this.state.pick || (s >= 5 ? 1 : 0);
    var A = [
      ['Log meeting activity', 'Summary saved as a note'],
      ['Update opportunity', '[field changes from your summary]'],
      ['Create task: demonstration', 'Due next week'],
      ['Create task: send proposal', 'Due Friday']
    ];
    var actions = A.map(function (a, i) {
      var failed = s >= 7 && fail && i === 3;
      var t = (0.9 + i * 0.8).toFixed(1) + 's';
      return {
        label: a[0],
        sub: failed ? 'Not written. Needs attention.' : a[1],
        subCls: failed ? 'warn' : '',
        isProposed: s === 4,
        isChecked: s === 5,
        isWriting: s === 6,
        isDone: s >= 7 && !failed,
        isFailed: failed,
        td: (0.3 + i * 0.35).toFixed(2) + 's',
        spinAnim: 'spin .8s linear infinite, hideat .01s ' + t + ' forwards',
        popAnim: 'pop .3s ' + t + ' both'
      };
    });
    var bars = [];
    for (var b = 0; b < 18; b++) { bars.push({ d: '-' + (b * 0.11).toFixed(2) + 's' }); }

    var statuses = ['Ready', 'Listening', 'Extracting', 'Searching Salesforce', 'Waiting for you', 'Writing to Salesforce', 'Done'];
    var actTitles = { 4: 'RECOMMENDED UPDATES', 5: 'REVIEW AND CONFIRM', 6: 'WRITING TO SALESFORCE' };
    var actTitle = s === 7 ? (fail ? '1 NEEDS ATTENTION' : 'ALL CHANGES SAVED') : (actTitles[s] || '');
    var gateCls = s <= 4 ? '' : (s === 5 ? 'wait' : 'open');
    var gateText = s <= 4 ? 'Confirmation gate: closed' : (s === 5 ? 'Confirmation gate: waiting' : 'Confirmation gate: open');

    var steps = STEPS.map(function (x, i) {
      var n = i + 1;
      return {
        n: n,
        label: x.label,
        aria: 'Step ' + n + ' of 7: ' + x.label,
        cur: n === s ? 'cur' : '',
        sn: n === s ? 'cur' : (n < s ? 'vis' : ''),
        pick: function () { self.demoGo(n, true); }
      };
    });

    return {
      c: {
        seller: nd('nd', [1, 2]),
        agent: 'nd dark on',
        group: nd('nd frame', W),
        pSearch: nd('nd pill', [4]),
        pIdent: nd('nd pill', [4]),
        pRetr: nd('nd pill', [7]),
        pAct: nd('nd pill', [6]),
        pUpd: nd('nd pill', [6]),
        pTask: nd('nd pill', [6]),
        mcp: nd('nd', W),
        cloud: nd('nd', W),
        opt: nd('nd opt', [6])
      },
      cap: { conv: cap('conv'), ext: cap('ext'), rec: cap('rec'), conf: cap('conf') },
      ar: { a1: ln([2]), a2: ln(W), a3: ln(W), a4: ln(W) },
      f: { a1: s === 2, down: s === 4 || s === 6, up: s === 4 || s === 7 },
      pk: {
        a4r: 'pkt pk-a4r ' + (s === 4 ? 'dl3' : 'dl0'),
        a3r: 'pkt pk-a3r ' + (s === 4 ? 'dl4' : 'dl1'),
        a2r: 'pkt pk-a2r ' + (s === 4 ? 'dl5' : 'dl2')
      },
      show: { user: s >= 2, extract: s >= 3, match: s >= 4 },
      words: words,
      extractRows: extractRows,
      matchRows: matchRows,
      actions: actions,
      bars: bars,
      steps: steps,
      ui: {
        status: statuses[s - 1],
        gateCls: gateCls,
        gateText: gateText,
        isListening: s === 2,
        notListening: s !== 2,
        hint: s === 1 ? 'Tap the mic to dictate' : 'Message Sales agent',
        micCls: s === 2 ? 'rec' : (s === 1 ? 'cue' : ''),
        srchDelay: s === 4 ? '1.5s' : '0s',
        oppDelay: s === 4 ? '2.6s' : '0s',
        pickDelay: s === 4 ? '3s' : '0s',
        actDelay: s === 4 ? '3.5s' : '0s',
        askOpp: s === 4 && !picked,
        oppResolved: !!picked,
        oppText: picked ? OPPS[picked - 1] : '2 opportunities match',
        oppSub: picked ? '' : 'Which one did you mean?',
        oppSubCls: picked ? '' : 'warn',
        oppA: OPPS[0],
        oppB: OPPS[1],
        actTitle: actTitle,
        foot4: s === 4,
        foot5: s === 5,
        foot6: s === 6,
        foot7: s === 7,
        showRetry: s === 7 && fail,
        summary: fail ? '3 of 4 written. The proposal task was not created.' : '4 of 4 written to Salesforce.',
        stepLabel: 'STEP ' + s + ' OF 7',
        evCls: ev.cls, evIcon: ev.icon, evText: ev.text, evTitle: ev.title,
        capText: cur.text,
        capHood: cur.hood,
        showFailToggle: s === 7,
        failPressed: fail,
        failLabel: fail ? 'Failed write shown. Tap to hide' : 'Simulate a failed write',
        playLabel: this.state.playing ? 'Pause' : 'Auto-play',
        playing: this.state.playing,
        backOff: s <= 1,
        isLast: s === 7,
        notLast: s !== 7,
        prog: Math.round((s - 1) * 139.43) + 'px'
      },
      back: function () { self.demoGo(s <= 1 ? 1 : s - 1, true); },
      next: function () { self.demoGo(s >= 7 ? 1 : s + 1, true); },
      goMic: function () { self.demoGo(2, true); },
      confirm: function () { self.demoGo(6, false); },
      retry: function () { self.setState({ fail: false }); },
      toggleFail: function () { self.setState({ fail: !self.state.fail }); },
      pickA: function () { self.setState({ pick: 1 }); },
      pickB: function () { self.setState({ pick: 2 }); },
      togglePlay: function () {
        var p = !self.state.playing;
        self.setState({ playing: p });
        if (p) { self.demoSchedule(); } else { clearTimeout(self._t); }
      }
    };
  }
}
</script>
<script type="text/plain" id="b-admin-css">
:host { --ink:#0E2433; --teal:#0A6570; --teal2:#0E7C86; --paper:#F6F3EE; --card:#FFFCF8; --line:#D4CFC6; --tint:#D4EBED; --tint2:#E6EEF0; --mute:#3E4C57; --sand:#EFE4D4; --sandline:#C4B59A; --amber:#7A4E00; --amberbg:#FFF1D6; --amberline:#B7791F; }

.tabs { position: absolute; right: 64px; top: 70px; display: flex; gap: 8px; }
.tab { height: 44px; padding: 0 18px; display: flex; align-items: center; border: 1.5px solid var(--ink); border-radius: 8px; background: var(--card); color: var(--ink); font-weight: 700; font-size: 15px; text-decoration: none; }

.tab.cur { background: var(--ink); color: #fff; }
.blabel { position: absolute; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--teal); line-height: 16px; }

.lcol { position: absolute; width: 424px; display: flex; flex-direction: column; }
.lrow { min-height: 48px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: var(--card); border: 1.5px solid var(--line); border-radius: 8px; font-size: 14.5px; line-height: 18px; }
.lrow.s { min-height: 44px; }
.lnum { flex: none; width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1.5px solid var(--amberline); background: var(--amberbg); color: var(--amber); font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; font-size: 12px; }

.nd { position: absolute; display: flex; align-items: center; justify-content: center; text-align: center; background: var(--card); border: 1.5px solid #B9B3A6; border-radius: 8px; color: var(--ink); font-size: 14px; line-height: 20px; transition: background .4s, border-color .4s, box-shadow .4s; }

.nd.frame, .nd.frame.done, .nd.frame.on { background: #fff; }
.nd.pill, .nd.crumb { font-size: 14px; line-height: 16px; padding: 0 8px; }
.nd.crumb.seq { animation: crumbin .5s both; }
.nd.fly { animation: fly .9s cubic-bezier(.3,.7,.2,1) both; }
.slot { position: absolute; border: 1.5px dashed #B9B3A6; border-radius: 8px; }
.stamp { position: absolute; width: 96px; height: 22px; display: flex; align-items: center; justify-content: center; border: 1.5px solid var(--teal); border-radius: 4px; background: var(--tint); color: var(--teal); font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; font-size: 12px; letter-spacing: .06em; animation: pop .35s both; }

.alabel { position: absolute; font-size: 14px; line-height: 16px; text-align: center; color: var(--mute); }
.callout { position: absolute; left: 548px; top: 622px; width: 640px; height: 116px; background: var(--sand); border: 1.5px dashed var(--sandline); border-radius: 8px; }
.closer { position: absolute; left: 548px; top: 754px; width: 828px; height: 44px; display: flex; align-items: center; padding: 0 20px; background: var(--ink); border-radius: 8px; color: #fff; font-weight: 700; font-size: 16px; }

.pkt { position: absolute; width: 10px; height: 10px; border-radius: 50%; background: var(--teal2); box-shadow: 0 0 0 3px rgba(14,124,134,.25); opacity: 0; animation-duration: 1.6s; animation-timing-function: ease-in-out; animation-iteration-count: infinite; animation-fill-mode: both; }
.pk-b1 { left: 765px; top: 392px; animation-name: mvx79; }
.pk-b2 { left: 1069px; top: 392px; animation-name: mvx79; }
.pk-b3 { left: 1261px; top: 559px; animation-name: mvy54; }

.capbar { position: absolute; left: 64px; top: 818px; width: 1312px; height: 76px; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; display: flex; align-items: center; gap: 20px; padding: 0 20px; }
.capbar .stp-old { flex: none; width: 118px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; font-size: 12px; letter-spacing: .08em; color: var(--teal); }

.capbar .s2 { font-size: 14px; line-height: 18px; color: var(--mute); }
.ctrls { position: absolute; left: 64px; top: 906px; display: flex; align-items: center; gap: 8px; }
.cbtn { height: 44px; min-width: 44px; padding: 0 16px; border: 1.5px solid var(--ink); border-radius: 8px; background: var(--card); color: var(--ink); font-weight: 700; font-size: 15px; cursor: pointer; }
.cbtn:hover { background: var(--tint); }
.cbtn.pri { background: var(--ink); color: #fff; }
.cbtn.pri:hover { background: var(--teal); }
.cbtn.big { height: 52px; padding: 0 18px; font-size: 16px; }
.cbtn.go { background: var(--teal); border-color: var(--teal); color: #fff; }
.cbtn.go:hover { background: var(--ink); }
a.cbtn { display: flex; align-items: center; text-decoration: none; }
.trk { position: absolute; left: 522px; top: 931px; width: 732px; height: 3px; background: var(--line); border-radius: 2px; }
.trk-f { position: absolute; left: 522px; top: 931px; height: 3px; background: var(--teal); border-radius: 2px; transition: width .5s ease; }
.steps { position: absolute; left: 400px; top: 910px; width: 976px; display: flex; }

.sn { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--card); border: 1.5px solid #6B7A84; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; font-size: 15px; transition: background .3s, color .3s, border-color .3s; }
.sn.vis { background: var(--tint); border-color: var(--teal); color: var(--teal); }
.sn.cur { background: var(--teal); border-color: var(--teal); color: #fff; box-shadow: 0 0 0 5px rgba(10,101,112,.2); }
.stp-b:hover .sn { border-color: var(--teal); }
.sl { font-size: 14px; line-height: 16px; text-align: center; max-width: 220px; color: var(--mute); }
.stp-b.cur .sl { color: var(--ink); font-weight: 700; }
.rise { animation: rise .5s cubic-bezier(.2,.8,.2,1) both; }

@keyframes glow { 0%, 100% { box-shadow: 0 0 0 3px rgba(10,101,112,.20); } 50% { box-shadow: 0 0 0 7px rgba(10,101,112,.08); } }
@keyframes mvx79 { 0% { opacity: 0; transform: translateX(0); } 10% { opacity: 1; } 70% { opacity: 1; transform: translateX(79px); } 80%, 100% { opacity: 0; transform: translateX(79px); } }
@keyframes mvy54 { 0% { opacity: 0; transform: translateY(0); } 10% { opacity: 1; } 70% { opacity: 1; transform: translateY(54px); } 80%, 100% { opacity: 0; transform: translateY(54px); } }
@keyframes fly { from { opacity: 0; transform: translateX(-608px); } 15% { opacity: 1; } to { opacity: 1; transform: none; } }
@keyframes crumbin { from { background: #FFFCF8; border-color: #B9B3A6; } to { background: #D4EBED; border-color: #0A6570; } }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) {
  .pkt, .nd.on { animation: none !important; }
  .rise, .stamp, .nd.fly, .nd.crumb.seq { animation-duration: .01s !important; animation-delay: 0s !important; }
}
.capbar .stp { flex: none; width: 176px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.ev { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border: 1.5px solid; border-radius: 4px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; font-size: 12px; line-height: 16px; letter-spacing: .02em; }

.ev.val { background: var(--amberbg); border: 1.5px dashed var(--amberline); color: var(--amber); }
.foot { position: absolute; left: 64px; right: 64px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; line-height: 16px; color: var(--mute); }

.capbar .stp { font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; font-size: 12px; letter-spacing: .08em; color: var(--teal); }
</script>
<script type="text/plain" id="b-admin-tpl">

<script type="text/plain" id="b-admin-js">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { step: 1, playing: false };
  }
  componentDidMount() { this._alive = true; this.demoSchedule(); }
  componentWillUnmount() { this._alive = false; clearTimeout(this._t); }
  demoSchedule() {
    clearTimeout(this._t);
    if (!this._alive || !this.state.playing) return;
    var DUR = [4600, 3400, 6600, 4600];
    var d = DUR[this.state.step - 1] || 4500;
    this._t = setTimeout(() => {
      if (!this._alive) return;
      var nxt = this.state.step >= 4 ? 1 : this.state.step + 1;
      this.setState({ step: nxt });
      this.demoSchedule();
    }, d);
  }
  demoGo(n, pause) {
    var up = { step: n };
    if (pause) up.playing = false;
    this.setState(up);
    this.demoSchedule();
  }
  demoSteps() {
    return [
      { label: 'Author in Copilot Studio', ev: 'cfg',
        text: 'In Copilot Studio, build a declarative agent that exposes only the Salesforce operations you need.',
        hood: 'For example, a Meeting Outcome Assistant. MCP in Copilot Studio needs generative orchestration turned on.',
        notes: { say: 'IT builds one declarative agent with only the operations the use case needs.', link: 'This happens once, in Copilot Studio.', q: 'What does Copilot Studio need?', a: 'Generative orchestration turned on. Copilot Studio supports MCP tools and resources, but not MCP prompts today.' } },
      { label: 'Publish the agent', ev: 'doc',
        text: 'Publish the declarative agent.',
        hood: 'Microsoft supports copying compatible MCP/API tools and knowledge from a published declarative agent.',
        notes: { say: 'Publishing makes its tools available to copy.', link: 'Next, the admin takes over.', q: 'Do sellers ever use this agent?', a: 'No. It is only the source of the tools. Sellers stay in Sales agent.' } },
      { label: 'Copy compatible tools', ev: 'doc',
        text: 'Copy the compatible tools and knowledge into Sales agent through Microsoft 365 admin.',
        hood: 'One source agent only. 150 KB combined. Copies are snapshots and can take up to 24 hours to appear.',
        notes: { say: 'Copying happens in the Microsoft 365 admin center, no extra runtime.', link: 'Agents, All agents, Sales, Custom tools and knowledge, then Choose agent.', q: 'Do copies stay in sync with the source?', a: 'No. A copy is a snapshot. Publish a new version, then use Update from store, which keeps assigned users and groups. Limits: one source agent, 150 KB combined, up to 24 hours to appear.' } },
      { label: 'Assign to seller groups', ev: 'doc',
        text: 'Assign the extension to your seller groups.',
        hood: 'Sellers stay in Sales agent. They never open the declarative agent.',
        notes: { say: 'Only the users and groups you assign get the tools.', link: 'That is the whole admin path.', q: 'Who can use the copied tools?', a: 'Only the users and security groups assigned in the Assign Users pane. Make sure they have permission to the tools and knowledge.' } }
    ];
  }
  meta() {
    var s = this.state.step, x = this.demoSteps()[s - 1];
    return { board: 'Admin setup', step: s, total: 4, label: x.label, caption: x.text, ev: x.ev, notes: x.notes };
  }
  renderVals() {
    var self = this;
    var s = this.state.step;
    var EV = window.DEMO_EV;
    var TEAL = '#0A6570', MID = '#5F9097', GREY = '#8a8378';
    var on = function (l) { return l.indexOf(s) >= 0; };
    var past = function (l) { for (var i = 0; i < l.length; i++) { if (l[i] < s) return true; } return false; };
    var nd = function (base, l) { return base + (on(l) ? ' on' : (past(l) ? ' done' : '')); };
    var ln = function (l) { return on(l) ? TEAL : (past(l) ? MID : GREY); };
    var STEPS = this.demoSteps();
    var cur = STEPS[s - 1];
    var ev = EV[cur.ev];
    var already = [
      'Voice input on mobile',
      'Meeting-note capture on compatible Salesforce records',
      'Native Salesforce integration and CRM lookup',
      'Voice notes and some opportunity updates (CRM coverage to confirm)'
    ].map(function (t, i) { return { t: t, d: (0.1 + i * 0.1).toFixed(2) + 's' }; });
    var gaps = [
      'Multi-entity extraction from one summary needs extension',
      'Extra record resolution needs MCP/API tools',
      'Reliable task creation needs compatible tools',
      'A unified multi-record write needs validation',
      'A combined approval experience needs validation',
      'No confirmed native custom prompt after a meeting',
      'Custom tools must be validated on mobile and Outlook'
    ].map(function (t, i) { return { n: i + 1, t: t, d: (0.6 + i * 0.1).toFixed(2) + 's' }; });
    var steps = STEPS.map(function (x, i) {
      var n = i + 1;
      return {
        n: n,
        label: x.label,
        aria: 'Step ' + n + ' of 4: ' + x.label,
        cur: n === s ? 'cur' : '',
        sn: n === s ? 'cur' : (n < s ? 'vis' : ''),
        pick: function () { self.demoGo(n, true); }
      };
    });
    return {
      c: {
        n1: nd('nd frame', [1, 2]),
        n2: nd('nd frame', [3]),
        n3: nd('nd frame', [3, 4]),
        tools: nd('nd pill', [1, 3]),
        crumb: s < 3 ? 'nd crumb' : (s === 3 ? 'nd crumb seq' : 'nd crumb done'),
        groups: nd('nd', [4])
      },
      ar: { b1: ln([2]), b2: ln([3]), b3: ln([4]) },
      f: { b1: s === 2, b2: s === 3, b3: s === 4 },
      show: { stamp: s >= 2, copied: s >= 3 },
      already: already,
      gaps: gaps,
      steps: steps,
      ui: {
        stepLabel: 'STEP ' + s + ' OF 4',
        evCls: ev.cls, evIcon: ev.icon, evText: ev.text, evTitle: ev.title,
        capText: cur.text,
        capHood: cur.hood,
        playLabel: this.state.playing ? 'Pause' : 'Auto-play',
        playing: this.state.playing,
        isFirst: s === 1,
        notFirst: s !== 1,
        isLast: s === 4,
        notLast: s !== 4,
        prog: Math.round((s - 1) * 244) + 'px'
      },
      back: function () { self.demoGo(s <= 1 ? 1 : s - 1, true); },
      next: function () { self.demoGo(s >= 4 ? 1 : s + 1, true); },
      togglePlay: function () {
        var p = !self.state.playing;
        self.setState({ playing: p });
        if (p) { self.demoSchedule(); } else { clearTimeout(self._t); }
      }
    };
  }
}
</script>

.cbtn.go:hover { background: var(--ink); }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: scale(.4); } to { opacity: 1; transform: scale(1); } }
@media (prefers-reduced-motion: reduce) {
  .rise, .vbox svg { animation-duration: .01s !important; animation-delay: 0s !important; }
}
.capbar .stp { flex: none; width: 176px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.ev { display: inline-flex; align-items: center; gap: 6px; padding: 2px 8px; border: 1.5px solid; border-radius: 4px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-weight: 500; font-size: 12px; line-height: 16px; letter-spacing: .02em; }
.ev.doc { background: var(--tint); border-color: var(--teal); color: var(--teal); }
.ev.cfg { background: #fff; border-color: var(--ink); color: var(--ink); }
.ev.val { background: var(--amberbg); border: 1.5px dashed var(--amberline); color: var(--amber); }
.foot { position: absolute; left: 64px; right: 64px; font-family: 'IBM Plex Mono', ui-monospace, Menlo, monospace; font-size: 12px; line-height: 16px; color: var(--mute); }
</script>
<script type="text/plain" id="b-gate-tpl">
<div class="ui grid" style="position: relative; width: 1440px; height: 928px; overflow: hidden">

<div class="eyebrow">IMPLEMENTATION PATH AND PRODUCTION GATE</div>
<h1 class="h1">Production gate</h1>
<div class="chip" style="left: 400px; top: 90px">WIREFRAME · ILLUSTRATIVE, NOT A VALIDATED BUILD</div>
<nav class="tabs" aria-label="Demo sections">
<a class="tab" href="#start">Overview</a>
<a class="tab" href="#seller">Seller flow</a>
<a class="tab" href="#admin">Admin setup</a>
<span class="tab cur" aria-current="page">Production gate</span>
</nav>

<div class="blabel" style="left: 64px; top: 150px">Production principles</div>
<div class="pcol">
<sc-for list="{{principles}}" as="p" hint-placeholder-count="6">
<div class="prin rise" style="animation-delay: {{p.d}}"><span class="dash">–</span><span>{{p.t}}</span></div>
</sc-for>
</div>

<div class="blabel" style="left: 504px; top: 150px">Validate before production · open items, not yet confirmed</div>
<div class="meter"></div>
<div class="meter-f" style="width: {{ui.prog}}"></div>
<div class="count">{{ui.count}} OF 8 VALIDATED</div>
<div class="hint">Tap an item to mark it validated. This tick-list lives only in this demo.</div>
<div class="vgrid">
<sc-for list="{{items}}" as="v" hint-placeholder-count="8">
<button type="button" class="vcard {{v.cls}}" aria-pressed="{{v.ok}}" onClick="{{v.pick}}">
<span class="vbox"><sc-if value="{{v.ok}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2.5 7.2l3 3L11.5 3.8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></sc-if></span>
<span class="vtx"><span class="vt">{{v.t}}</span><span class="vs">{{v.s}}</span></span>
<span class="vst">{{v.status}}</span>
</button>
</sc-for>
</div>

<div class="dec {{ui.clear}}">
<div class="lab">DECISION</div>
<div class="tx">Proceed with this architecture, subject to confirming that the chosen Salesforce tools support the operations, user confirmation, and reliable multi-record processing inside the customer's Sales agent experience. If a requirement cannot be met with supported capabilities, extend the architecture only for that specific gap.<br><b>Next step:</b> validate these eight items in your own tenant and Salesforce org before go-live.</div>
<div class="gst {{ui.clear}}">{{ui.gateText}}</div>
</div>

<div class="ctrls">
<a class="cbtn" href="#admin">Back: Admin setup</a>
<a class="cbtn go" href="#start">Back to overview</a>
</div>
<div class="foot" style="top: 890px">Checked 4 Nov 2026 against Microsoft Learn (Sales agent, Copilot Studio) and Salesforce hosted MCP documentation. Preview features can change. Example data only.</div>
</div>
</script>
<script type="text/plain" id="b-gate-js">
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { ok: [false, false, false, false, false, false, false, false] };
  }
  meta() {
    return {
      board: 'Production gate', step: 1, total: 1, label: 'Production gate',
      caption: 'Principles, and eight items to validate before go-live.',
      ev: null,
      notes: {
        say: 'These are open items, not claims.',
        link: 'Click an item to mark it validated. The list lives only in this demo.',
        q: 'Why is nothing ticked?',
        a: 'This is a proposed architecture and the demo is illustrative. We confirm these eight items in your tenant and Salesforce org before go-live. The one next step is to validate them.'
      }
    };
  }
  renderVals() {
    var self = this;
    var ok = this.state.ok;
    var count = 0;
    for (var i = 0; i < ok.length; i++) { if (ok[i]) { count++; } }
    var principles = [
      'Sales agent is the only seller-facing assistant.',
      'Copilot Studio supplies compatible tools; M365 Copilot orchestrates.',
      'Salesforce is the only CRM system of record.',
      'Every CRM change needs user confirmation and Salesforce authorisation.',
      'No Azure integration service unless a named gap cannot be met any other way.',
      "Validate the extension on the customer's mobile and Outlook clients before go-live."
    ].map(function (t, i) { return { t: t, d: (0.1 + i * 0.1).toFixed(2) + 's' }; });
    var raw = [
      ['Salesforce MCP/API', 'Supported operations, per-user sign-in, and MCP tools only (no prompts)'],
      ['Copied tools in Sales agent', 'Invoked reliably. One source agent, 150 KB cap, snapshot refresh'],
      ['Voice and extraction', 'Voice updates are documented for Dynamics 365 Sales; confirm for Salesforce'],
      ['Confirmation', 'Single and multi-record approval, and which-record questions'],
      ['Permissions and audit', 'Runs as the seller: field security, sharing rules, audit trail'],
      ['Errors and duplicates', 'Retries, partial failures, and duplicate prevention'],
      ['Mobile and Outlook', 'Behaviour of copied tools in your mobile and Outlook clients'],
      ['Licensing and governance', 'Editions, licences, data governance, and production support']
    ];
    var items = raw.map(function (r, i) {
      return {
        t: r[0],
        s: r[1],
        ok: ok[i],
        cls: ok[i] ? 'ok' : '',
        status: ok[i] ? 'VALIDATED' : 'OPEN',
        pick: function () {
          var nx = self.state.ok.slice();
          nx[i] = !nx[i];
          self.setState({ ok: nx });
        }
      };
    });
    var all = count === 8;
    return {
      principles: principles,
      items: items,
      ui: {
        count: count,
        prog: Math.round(count / 8 * 360) + 'px',
        clear: all ? 'clear' : '',
        gateText: all ? 'ALL 8 ITEMS VALIDATED' : (8 - count) + ' OF 8 ITEMS STILL OPEN'
      }
    };
  }
}
</script>

  /* ---------- Boards ---------- */
  var BOARDS = {
    seller: { id: 'main',  title: 'Seller flow',     w: 1440, h: 1072, printH: 948, footTop: 924, init: { step: 7 } },
    admin:  { id: 'admin', title: 'Admin setup',     w: 1440, h: 1048, printH: 930, footTop: 906, init: { step: 4 } },
    gate:   { id: 'gate',  title: 'Production gate', w: 1440, h: 928,  printH: 828, footTop: 804, init: {} }

  // Print shows each board in its finished state: no motion, no controls, footer pulled up under the caption bar.
  var PRINT_CSS = '*,*::before,*::after{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important;transition:none!important}' +
    '.ctrls,.steps,.trk,.trk-f,.tabs,.pkt,.cbtn{display:none!important}.ui{-webkit-print-color-adjust:exact;print-color-adjust:exact}';

  function part(id, kind) { return document.getElementById('b-' + id + '-' + kind).textContent; }
  function load(key) {
    var b = BOARDS[key];
    if (!b.ready) {

  var current = null;      // mounted board on the board view
  var cleanup = null;
  var notesWin = null;
  var inlineOpen = false;
  var lastMeta = null;

  /* ---------- Presenter notes ---------- */
  function NotesView(props) {

    var ev = d.ev ? EV[d.ev] : null, n = d.notes || {};
    return h('div', { class: 'nv' },
      h('div', { class: 'nv-top' }, h('span', { class: 'nv-board' }, d.board), h('span', { class: 'nv-step' }, d.total > 1 ? 'Step ' + d.step + ' of ' + d.total : 'Closing board')),
      ev ? h('div', { class: 'ev ' + ev.cls, title: ev.title }, h('span', { 'aria-hidden': 'true' }, ev.icon), h('span', null, ev.text)) : null,
      ev ? h('p', { class: 'nv-evl' }, ev.long) : null,
      h('h2', null, d.label),
      h('p', { class: 'nv-cap' }, 'On screen: ' + d.caption),
      h('h3', null, 'Key message'), h('p', null, n.say),
      h('h3', null, 'Say next'), h('p', null, n.link),
      h('h3', null, 'Likely question'), h('p', { class: 'nv-q' }, n.q), h('p', null, n.a),
      h('div', { class: 'nv-btns' },
        h('button', { type: 'button', onClick: function () { props.onCmd('back'); } }, 'Back'),
        h('button', { type: 'button', class: 'go', onClick: function () { props.onCmd('next'); } }, 'Next step')),
      props.onClose ? h('button', { type: 'button', class: 'nv-close', onClick: props.onClose }, 'Close notes') : null);
  }
  function publish(logic) {
    lastMeta = logic && logic.meta ? logic.meta() : null;
    if (notesWin && !notesWin.closed) {
      try { notesWin.postMessage({ type: 'state', data: lastMeta }, '*'); } catch (e) { /* ignore */ }
    }

  }
  function renderInline() {
    render(h(NotesView, { data: lastMeta, onCmd: runCmd, onClose: toggleNotes }), inlineEl);
  }
  function toggleNotes() {

  /* ---------- Start screen ---------- */
  function StartScreen() {
    var cust = window.DEMO_CUSTOMER;
    function chapter(href, role, title, text, meta, primary) {
      return h('a', { class: 'card' + (primary ? ' primary' : ''), href: href },

      h('p', { class: 'meta' }, 'Example data only. Checked 4 Nov 2026 against Microsoft Learn and Salesforce hosted MCP documentation. Preview features can change.'),

    var m = /^#(seller|admin|gate|print|notes|start)$/.exec(window.location.hash);

  }
  function go() {
    if (cleanup) { cleanup(); cleanup = null; }
    current = null; lastMeta = null;

    window.scrollTo(0, 0);

      document.title = 'Print view · ' + title;
    } else if (r === 'notes') {
      body.setAttribute('data-view', 'notes');
      document.title = 'Presenter notes · ' + title;
      render(h(NotesView, { data: null }), viewEl);
      cleanup = function () { render(null, viewEl); };
      if (window.opener) { try { window.opener.postMessage({ type: 'hello' }, '*'); } catch (e) { /* ignore */ } }
    } else {
      body.setAttribute('data-view', 'start');
      render(h(StartScreen), viewEl);
      cleanup = function () { render(null, viewEl); };
      document.title = title;
    }
  }
  window.addEventListener('hashchange', go);
  window.addEventListener('resize', fit);

  /* ---------- Presenter keys ---------- */
  window.addEventListener('keydown', function (e) {
    if (e.altKey || e.ctrlKey || e.metaKey) { return; }
    var view = body.getAttribute('data-view');
    if (view !== 'board') { return; }
    var el = null;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { el = ctrl(/^Next/); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { el = ctrl(/^Back/); }
    else if (e.key === 'p' || e.key === 'P') { el = ctrl(/^(Auto-play|Pause)/); }
    else if (e.key === 'n' || e.key === 'N') { e.preventDefault(); toggleNotes(); return; }
    else if (e.key === 'Escape' && inlineOpen) { toggleNotes(); return; }
    else if (e.key === 'f' || e.key === 'F') {
      e.preventDefault();
      if (document.fullscreenElement) { document.exitFullscreen(); }
      else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
      return;
    }
    if (el) { e.preventDefault(); el.click(); }
  });

  go();
})();
</script>
</body>
</html>
