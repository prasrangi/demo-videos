<div class="demobar" id="demobar" role="region" aria-label="Demo status and controls">
  <div class="banner" id="banner"><span id="bannerIcon"></span><span>Interactive wireframe · Sample data · No live CRM or calendar changes</span></div>
  <div class="democtl" role="group" aria-label="Demo controls">
    <span class="lbl" aria-hidden="true">Demo controls</span>
    <label class="vh" for="scenSel">Choose scenario</label>
    <select id="scenSel">
      <option value="" selected disabled>Choose scenario…</option>
      <optgroup label="Main journey">
        <option value="main">Main flow · Atlas Metals Group sample notes</option>
      </optgroup>
      <optgroup label="Missing and conflicting details">
        <option value="A">A · Missing details</option>
        <option value="B">B · End before start</option>
        <option value="C">C · Weekday and date conflict</option>
        <option value="D">D · Ambiguous “11”</option>
        <option value="E">E · Relative date with a stated anchor</option>
        <option value="F1">F · Ambiguous timezone (IST)</option>
        <option value="F2">F · Daylight-saving repeated hour</option>
      </optgroup>
      <optgroup label="More scenarios">
        <option value="multi">Multiple Event proposals</option>
        <option value="inject">Embedded command in notes</option>
        <option value="context">Customer context · four outcomes</option>
      </optgroup>
    </select>
    <button class="btn sm" type="button" id="btnReset" data-act="reset">Reset demo</button>
    <button class="btn sm" type="button" id="btnPresenter" data-act="togglePresenter" aria-pressed="false">Presenter view</button>
    <button class="btn sm tipsw" type="button" id="btnTips" data-act="toggleTips" aria-pressed="true"><span>Guide tips</span><span class="sw" aria-hidden="true">On</span></button>
  </div>
</div>

<div class="shell" id="shell">
  <header class="topbar">
    <span id="waffle"></span>
    <span class="app">Sales</span><span class="muted small">Workspace</span>
    <span class="sp"></span>
    <button class="btn sm only-narrow" type="button" id="btnDetails" data-act="toggleDrawer" aria-expanded="false" aria-controls="panel">Details panel</button>
    <button class="btn sm" type="button" data-act="openHelp" id="btnHelp">How the assistant handles your details</button>
    <span class="seller"><span class="avatar" aria-hidden="true">DS</span><span>Demo seller <span class="muted">(sample)</span></span></span>
  </header>
  <nav class="nav" id="nav" aria-label="Sales navigation"></nav>
  <main id="main" tabindex="-1"></main>
  <aside class="panel" id="panel" aria-label="Event details and evidence"></aside>
</div>
